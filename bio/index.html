  <style>
    :root {
      --ferro:     #0A0A0A;
      --grafite:   #1E1E1E;
      --concreto:  #6E6E6E;
      --titanio:   #B2AFAB;
      --argamassa: #F0EEEC;
      --surface:   #E7E4DF;
      --line:      rgba(10,10,10,.14);
      --f-display: 'Barlow Condensed', sans-serif;
      --f-body:    'Barlow', sans-serif;
      --junta: 7px; /* espaçamento entre as "peças", como a junta de um assentamento */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--f-body);
      font-weight: 400;
      background: var(--argamassa);
      color: var(--grafite);
      line-height: 1.5;
      letter-spacing: .01em;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    a { text-decoration: none; color: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--ferro); outline-offset: 3px; }

    .pagina {
      width: 100%;
      max-width: 460px;
      padding: clamp(36px, 9vw, 56px) 22px 28px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* ── Cabeçalho ─────────────────────────────── */
    .marca { text-align: center; margin-bottom: clamp(28px, 7vw, 40px); }
    .marca-logo {
      width: 46px; height: 72px;
      margin: 0 auto 14px;
      fill: var(--ferro);
    }
    .marca-nome {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: clamp(30px, 8vw, 36px);
      letter-spacing: .34em;
      margin-right: -.34em; /* compensa o tracking no centramento */
      text-transform: uppercase;
      color: var(--ferro);
    }
    .marca-tag {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 300;
      color: var(--concreto);
      letter-spacing: .04em;
    }
    .marca-local {
      margin-top: 10px;
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--titanio);
    }

    /* ── Peças (links) — assentamento em fiadas ── */
    .parede { display: flex; flex-direction: column; gap: var(--junta); }

    .peca {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 17px 18px;
      min-height: 72px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      box-shadow: 0 1px 0 rgba(10,10,10,.06);
    }
    .peca:hover, .peca:active {
      transform: translateY(1px);
      box-shadow: none;
      background: var(--surface);
    }

    .peca-icone {
      flex: none;
      width: 38px; height: 38px;
      display: grid; place-items: center;
      background: var(--argamassa);
      border: 1px solid var(--line);
    }
    .peca-icone svg { width: 18px; height: 18px; stroke: var(--grafite); fill: none; stroke-width: 1.6; }
    .peca-icone svg.preenchido { fill: var(--grafite); stroke: none; }

    .peca-textos {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .peca-titulo {
      display: block;
      font-family: var(--f-display);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ferro);
      line-height: 1.2;
    }
    .peca-sub {
      display: block;
      font-size: 12.5px;
      font-weight: 300;
      color: var(--concreto);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .peca-seta { flex: none; font-family: var(--f-display); color: var(--titanio); font-size: 18px; transition: transform .16s ease; }
    .peca:hover .peca-seta { transform: translateX(3px); color: var(--ferro); }

    /* peça de destaque — WhatsApp */
    .peca--destaque { background: var(--ferro); border-color: var(--ferro); box-shadow: 0 2px 0 rgba(10,10,10,.25); }
    .peca--destaque .peca-titulo { color: var(--argamassa); }
    .peca--destaque .peca-sub { color: var(--titanio); }
    .peca--destaque .peca-icone { background: var(--grafite); border-color: rgba(240,238,236,.16); }
    .peca--destaque .peca-icone svg { stroke: var(--argamassa); }
    .peca--destaque .peca-icone svg.preenchido { fill: var(--argamassa); stroke: none; }
    .peca--destaque .peca-seta { color: var(--concreto); }
    .peca--destaque:hover, .peca--destaque:active { background: var(--grafite); }
    .peca--destaque:hover .peca-seta { color: var(--argamassa); }

    /* ── Rodapé ────────────────────────────────── */
    .rodape {
      margin-top: auto;
      padding-top: 36px;
      text-align: center;
      font-family: var(--f-display);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--titanio);
    }
    .rodape a { border-bottom: 1px solid transparent; }
    .rodape a:hover { color: var(--concreto); border-bottom-color: var(--concreto); }

    @media (prefers-reduced-motion: reduce) {
      .peca, .peca-seta { transition: none; }
    }
  </style>
</head>

  <main class="pagina">

  <script>
  (function () {
    'use strict';

    /* ════════════════════════════════════════════════════════════
       CONFIGURAÇÃO DOS LINKS
       Pra adicionar, remover ou reordenar canais, edite só esta
       lista. O `id` identifica o link no relatório de cliques —
       depois de publicado, não mude o id de um link existente,
       senão o histórico dele "quebra" em dois no relatório.
    ════════════════════════════════════════════════════════════ */
    var SITE = 'https://brutoceramica.com.br/';
    var UTM  = '?utm_source=instagram&utm_medium=bio&utm_campaign=link_bio';

    var LINKS = [
      {
        id: 'whatsapp',
        titulo: 'Falar com um consultor',
        sub: 'Atendimento direto no WhatsApp',
        href: '#', // preenchido pelo rodízio de atendentes abaixo
        destaque: true,
        icone: 'whatsapp'
      },
      {
        id: 'texturas',
        titulo: 'Coleções & Texturas',
        sub: 'O catálogo completo da curadoria',
        href: SITE + 'texturas.html' + UTM,
        icone: 'grade'
      },
      {
        id: 'quiz',
        titulo: 'Descubra seu revestimento',
        sub: 'Um guia rápido pra achar a peça certa',
        href: SITE + 'quiz.html' + UTM,
        icone: 'bussola'
      },
      {
        id: 'paginacoes',
        titulo: 'Paginações & Assentamento',
        sub: 'Padrões pra visualizar sua parede',
        href: SITE + 'paginacoes.html' + UTM,
        icone: 'assentamento'
      },
      {
        id: 'blog',
        titulo: 'Blog',
        sub: 'Técnica, tendência e obra de verdade',
        href: SITE + 'blog.html' + UTM,
        icone: 'texto'
      },
      {
        id: 'site',
        titulo: 'Site oficial',
        sub: 'brutoceramica.com.br',
        href: SITE + UTM.replace('?', '?pg=home&'),
        icone: 'casa'
      }
    ];

    var ICONES = {
      whatsapp: '<svg viewBox="0 0 24 24" class="preenchido" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.5 14.1c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-2.9-1.3-4.8-4.2-5-4.4-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.4.2.5.7 1.9.8 2 .1.1.1.3 0 .5l-.4.6c-.1.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 .9c.3.1.5.2.5.3.1.1.1.5-.1 1.2Z"/></svg>',
      grade: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5"/><rect x="13" y="3.5" width="7.5" height="7.5"/><rect x="3.5" y="13" width="7.5" height="7.5"/><rect x="13" y="13" width="7.5" height="7.5"/></svg>',
      bussola: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 4.2L9 15l2-4.2L15 9Z"/></svg>',
      assentamento: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h17M3.5 12h17M3.5 19h17M8 5v7M16 5v7M12 12v7"/></svg>',
      texto: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14M5 9.5h14M5 14.5h9M5 19.5h6"/></svg>',
      casa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>'
    };

    /* ── Monta as peças ─────────────────────────── */
    var parede = document.getElementById('parede');
    LINKS.forEach(function (link) {
      var a = document.createElement('a');
      a.className = 'peca' + (link.destaque ? ' peca--destaque' : '');
      a.href = link.href;
      a.dataset.id = link.id;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<span class="peca-icone">' + (ICONES[link.icone] || '') + '</span>' +
        '<span class="peca-textos">' +
          '<span class="peca-titulo">' + link.titulo + '</span>' +
          '<span class="peca-sub">' + link.sub + '</span>' +
        '</span>' +
        '<span class="peca-seta" aria-hidden="true">→</span>';
      parede.appendChild(a);
    });

    /* ════════════════════════════════════════════════════════════
       RODÍZIO DE ATENDENTES (WhatsApp)
       Usa a mesma API e a mesma chave de sessão do site principal:
       se o visitante já falou com um atendente pelo site, cai no
       mesmo atendente aqui — e vice-versa.
    ════════════════════════════════════════════════════════════ */
    var API_RODIZIO = '/api/whatsapp-atendimento.php';
    var CHAVE_SESSAO = 'bruto_whatsapp_atendimento';
    var NUMERO_FALLBACK = '5511990049468';
    var MSG = 'Olá! Vim pelo Instagram da BRUTO e gostaria de falar com um consultor.';

    function linkWhats(numero) {
      return 'https://wa.me/' + numero + '?text=' + encodeURIComponent(MSG);
    }

    var pecaWhats = parede.querySelector('[data-id="whatsapp"]');
    if (pecaWhats) {
      pecaWhats.href = linkWhats(NUMERO_FALLBACK); // rede de segurança imediata
      var cache = null;
      try { cache = JSON.parse(sessionStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) {}
      if (cache && cache.numero) {
        pecaWhats.href = linkWhats(cache.numero);
      } else {
        fetch(API_RODIZIO, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw 0; return r.json(); })
          .then(function (dados) {
            if (dados && dados.numero) {
              try { sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify(dados)); } catch (e) {}
              pecaWhats.href = linkWhats(dados.numero);
            }
          })
          .catch(function () { /* mantém o fallback */ });
      }
    }

    /* ════════════════════════════════════════════════════════════
       RASTREIO DE CLIQUES
       Cada clique (e cada visita) vira um beacon leve pra
       /api/bio-clique.php. Nada de dado pessoal: só o id do link
       e o dia. O relatório vive em /bio/relatorio.html.
    ════════════════════════════════════════════════════════════ */
    var API_CLIQUE = '/api/bio-clique.php';
    var CHAVE_OPT_OUT = 'bruto_bio_sem_rastreio';

    // Opt-out permanente deste dispositivo: abrir uma vez
    // /bio/?semrastreio=1 grava a marca e o navegador nunca mais
    // reporta visitas/cliques daqui. Repita em cada dispositivo
    // seu (computador, celular). Some se limpar os dados do site.
    try {
      if (new URLSearchParams(location.search).get('semrastreio') === '1') {
        localStorage.setItem(CHAVE_OPT_OUT, '1');
      }
    } catch (e) {}

    function estaDeFora() {
      try { return localStorage.getItem(CHAVE_OPT_OUT) === '1'; } catch (e) { return false; }
    }

    function registrar(id) {
      if (estaDeFora()) return;
      var corpo = JSON.stringify({ id: id });
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(API_CLIQUE, new Blob([corpo], { type: 'application/json' }));
          return;
        }
      } catch (e) {}
      try {
        fetch(API_CLIQUE, { method: 'POST', body: corpo, keepalive: true, headers: { 'Content-Type': 'application/json' } });
      } catch (e) {}
    }

    // visita da página (base pra taxa de clique no relatório)
    registrar('_visita');

    // cliques em qualquer elemento com data-id (peças + e-mail do rodapé)
    document.addEventListener('click', function (ev) {
      var alvo = ev.target.closest('[data-id]');
      if (alvo) registrar(alvo.dataset.id);
    });
  })();
  </script>
