                </div>
              </>
            ) : (
              <div style={{ fontSize: 11, color: "#888888", marginTop: 14, lineHeight: 1.6 }}>
                Não foi possível confirmar seu acesso agora.{authError?.message ? ` (${authError.message})` : ""}
                {" "}Recarregue a página — se persistir, avise um administrador.
              </div>
            )}
            <button style={{ ...S.formButton, marginTop: 16 }} onClick={() => window.location.reload()}>Recarregar</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={S.root}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Barlow+Condensed:wght@400;600;700&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:rgba(87,153,155,.25);border-radius:2px}
        ::-webkit-scrollbar-track{background:transparent}
        .kb-item:hover{background:rgba(87,153,155,.08)!important;border-color:rgba(87,153,155,.3)!important;color:#57999B!important}
      `}</style>

      <div style={S.app}>
        <div style={S.led}/>

        {/* HEADER */}
        <header style={S.header}>
          <div style={S.logoLockup}>
            <svg viewBox="0 0 176 286" width="18" height="29" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink: 0 }}>
              <path fillRule="evenodd" fill={white} d="M0,0 L132,0 L132,132 L176,132 L176,286 L0,286 Z M22,22 L110,22 L110,132 L22,132 Z M22,154 L154,154 L154,264 L22,264 Z"/>
            </svg>
            <div style={S.lockupDivider}/>
            <span style={S.logoMark}>BRUTO</span>
            <div style={S.logoDash}/>
            <span style={S.logoCo}>ATENDIMENTO</span>
            <div style={S.lockupDivider}/>
            <span style={S.stampBy}>by</span>
            <span style={S.stampUp}>UP</span>
            <span style={S.stampDash}>—</span>
            <span style={S.stampCo}>Co.</span>
          </div>
          <div style={S.headerRight}>
            <button style={S.newChatBtn} onClick={startNewSession} title="Nova Conversa"><Plus size={13} strokeWidth={2}/> Nova</button>
            <button style={S.newChatBtn} onClick={() => setRecommendModalOpen(true)} title="Recomendar linha para um projeto"><Target size={13} strokeWidth={2}/> Recomendar</button>
            <button style={S.newChatBtn} onClick={openHandoffModal} title="Gerar resumo para WhatsApp"><ClipboardList size={13} strokeWidth={2}/> Resumo</button>
            {currentUser.papel === "admin" && (
              <button style={S.newChatBtn} onClick={openUserMgmt} title="Gestão de usuários"><Users size={13} strokeWidth={2}/> Usuários</button>
            )}
            <div style={S.modeToggle(trainingMode)} onClick={() => { setTrainingMode((v) => !v); endTraining(); }} title="Modo Treino"><GraduationCap size={14} strokeWidth={1.75}/></div>
            <div style={S.modeToggle(mode === "consulta")} onClick={() => { setMode("consulta"); setDiagFlow(null); }} title="Modo Consulta"><HelpCircle size={14} strokeWidth={1.75}/></div>
            <div style={S.modeToggle(mode === "diagnostico")} onClick={() => setMode("diagnostico")} title="Modo Diagnóstico"><Stethoscope size={14} strokeWidth={1.75}/></div>
            <div style={S.statusBadge}><span style={S.dot}/>Sistema ativo</div>
            <div style={S.userBadge} title={currentUser.papel === "admin" ? "Administrador" : "Atendente"}>
              {currentUser.nome}{currentUser.papel === "admin" ? " ★" : ""}
              <button style={S.logoutBtn} onClick={doLogout} title="Tenta encerrar a sessão (Basic Auth não garante logout em todo navegador)">Sair</button>
            </div>
          </div>
        </header>

        <div style={S.bodyWrap}>
          {/* SIDEBAR */}
          <aside style={S.aside}>
            <div style={S.sidebarSection}>
              <div style={S.sectionTitle}>Cliente</div>
              <div style={S.clientCard}>
                <div style={S.clientName}>{client.name || "— Perfil não carregado"}</div>
                <div style={S.clientDetail} dangerouslySetInnerHTML={{ __html:
                  [
                    client.phone ? `<strong>Telefone:</strong> ${client.phone}` : "",
                    client.type ? `<strong>Tipo:</strong> ${client.type}` : "",
                    client.project ? `<strong>Projeto:</strong> ${client.project}` : "",
                    client.tags.length ? `<strong>Tags:</strong> ${client.tags.join(", ")}` : "",
                  ].filter(Boolean).join("<br/>") || "Clique para editar"
                }} />
                <button style={S.editBtn} onClick={openClientModal}>Editar Perfil</button>
              </div>
            </div>

            {/* PAINEL FIXO — QUANDO ESCALAR (sempre visível, não depende de IA) */}
            <div style={{ borderBottom: `1px solid ${border}` }}>
              <div
                style={{ ...S.sidebarSection, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(239,68,68,.06)", borderBottom: escalationOpen ? `1px solid rgba(239,68,68,.2)` : "none" }}
                onClick={() => setEscalationOpen((v) => !v)}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 13 }}>🛑</span>
                  <span style={{ ...S.sectionTitle, color: "#F87171" }}>Quando Escalar</span>
                </div>
                <span style={{ fontSize: 9, color: mid, transform: escalationOpen ? "rotate(180deg)" : "none", transition: ".2s" }}>▾</span>
              </div>
              {escalationOpen && (
                <div style={{ padding: "10px 13px", fontSize: 9.5, color: "#ddd", lineHeight: 1.7 }}>
                  Pare e chame o responsável, sem prometer nada ao cliente, se aparecer:
                  <ul style={{ margin: "6px 0 0", paddingLeft: 15 }}>
                    <li>Pedido grande / construtora / revenda</li>
                    <li>Pedido de desconto ou condição especial</li>
                    <li>Ameaça de Procon, processo ou avaliação pública negativa</li>
                    <li>Defeito contestado que a IA não resolveu com clareza</li>
                    <li>Pergunta técnica fora do padrão (uso submerso, fachada muito alta)</li>
                    <li>Imprensa, influenciador ou proposta de parceria</li>
                    <li>Cliente muito insatisfeito ou tom agressivo</li>
                  </ul>
                </div>
              )}
            </div>

            {/* CALCULADORA DE ÁREA — determinística, sem IA */}
            <div style={{ borderBottom: `1px solid ${border}` }}>
              <div
                style={{ ...S.sidebarSection, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: calcOpen ? `1px solid ${border}` : "none" }}
                onClick={() => setCalcOpen((v) => !v)}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 12 }}>📐</span>
                  <span style={S.sectionTitle}>Calculadora de Área</span>
                </div>
                <span style={{ fontSize: 9, color: mid, transform: calcOpen ? "rotate(180deg)" : "none", transition: ".2s" }}>▾</span>
              </div>
              {calcOpen && (
                <div style={{ padding: "10px 13px" }}>
                  <label style={{ fontSize: 9, color: mid2, display: "block", marginBottom: 3 }}>Área do projeto (m²)</label>
                  <input
                    type="number" min="0" step="0.1" value={calcArea}
                    onChange={(e) => setCalcArea(e.target.value)}
                    placeholder="Ex: 12.5"
                    style={{ width: "100%", padding: "6px 8px", background: "#111", border: `1px solid ${border}`, borderRadius: 5, color: white, fontSize: 11, fontFamily: dm, marginBottom: 8, boxSizing: "border-box" }}
                  />
                  <label style={{ fontSize: 9, color: mid2, display: "block", marginBottom: 3 }}>Perda técnica de corte</label>
                  <select
                    value={calcWaste} onChange={(e) => setCalcWaste(Number(e.target.value))}
                    style={{ width: "100%", padding: "6px 8px", background: "#111", border: `1px solid ${border}`, borderRadius: 5, color: white, fontSize: 11, fontFamily: dm, marginBottom: 8, boxSizing: "border-box" }}
                  >
                    <option value={10}>10% — parede reta, poucos recortes (Cimentício)</option>
                    <option value={15}>15% — padrão (Brick / Rockface)</option>
                    <option value={20}>20% — muitos cantos, recortes, vãos</option>
                  </select>
                  {calcArea && !isNaN(parseFloat(calcArea)) && parseFloat(calcArea) > 0 && (
                    <div style={{ background: "rgba(87,153,155,.08)", border: `1px solid rgba(87,153,155,.25)`, borderRadius: 6, padding: "8px 10px", fontSize: 10.5, color: white }}>
                      Comprar: <strong style={{ color: teal }}>{(parseFloat(calcArea) * (1 + calcWaste / 100)).toFixed(2)} m²</strong>
                      <div style={{ fontSize: 9, color: mid2, marginTop: 2 }}>{calcArea} m² de projeto + {calcWaste}% de perda técnica</div>
                    </div>
                  )}
                  <div style={{ fontSize: 8.5, color: mid2, marginTop: 6, lineHeight: 1.5 }}>
                    Cálculo determinístico (não usa IA) — sempre confirme a quantidade final com o consultor antes de fechar o pedido.
                  </div>
                </div>
              )}
            </div>

            <div style={{ borderBottom: `1px solid ${border}` }}>
              <div
                style={{ ...S.sidebarSection, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: kbSectionOpen ? `1px solid ${border}` : "none" }}
                onClick={() => setKbSectionOpen((v) => !v)}
              >
                <span style={S.sectionTitle}>Focar em um Tema (opcional)</span>
                <span style={{ fontSize: 9, color: mid, transform: kbSectionOpen ? "rotate(180deg)" : "none", transition: ".2s" }}>▾</span>
              </div>
              {kbSectionOpen && (
                <div style={{ padding: "10px 13px 4px" }}>
                  <div style={{ fontSize: 9, color: mid2, marginBottom: 10, lineHeight: 1.5 }}>
                    Não precisa selecionar nada — toda a base já está disponível em qualquer pergunta. Use isto só se quiser pedir foco extra num assunto específico.
                  </div>
                  {KB_LIST.map((group) => (
                    <div key={group.group} style={{ marginTop: 12 }}>
                      <div style={S.kbGroupLabel}>{group.group}</div>
                      {group.items.map((item) => (
                        <div
                          key={item.key}
                          className="kb-item"
                          style={S.kbItem(selectedKB.includes(item.key))}
                          onClick={() => toggleKB(item.key)}
                        >
                          <item.icon size={12} strokeWidth={1.75}/>{item.label}
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div style={S.tipBox}>
              <div style={S.sectionTitle}>Como Usar</div>
              <div style={{ fontSize: 9, color: "#888", lineHeight: 1.6, display: "flex", gap: 6, alignItems: "flex-start" }}>
                <Lightbulb size={12} strokeWidth={1.75} style={{ flexShrink: 0, marginTop: 1, color: teal }}/>
                É só digitar a pergunta ou objeção do cliente e enviar. A resposta já sai pronta, com todo o contexto técnico e comercial da Bruto.
              </div>
            </div>


            {/* HISTÓRICO */}
            <div style={{ borderTop: `1px solid ${border}` }}>
              <div
                style={{ ...S.sidebarSection, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: historyOpen ? `1px solid ${border}` : "none" }}
                onClick={() => setHistoryOpen((v) => !v)}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <History size={11} strokeWidth={1.75} style={{ color: teal }}/>
                  <span style={S.sectionTitle}>Histórico</span>
                  {sessionIndex.length > 0 && <span style={S.histBadge}>{sessionIndex.length}</span>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  {currentUser.papel === "admin" && (
                    <button
                      style={{ ...S.histActionBtn, color: adminViewAll ? "#57999B" : undefined, borderColor: adminViewAll ? "#57999B" : undefined }}
                      title={adminViewAll ? "Vendo: equipe inteira (clique para ver só as suas)" : "Ver conversas de toda a equipe"}
                      onClick={(e) => { e.stopPropagation(); toggleAdminView(); }}
                    >Equipe</button>
                  )}
                  <button style={S.histActionBtn} title="Exportar histórico" onClick={(e) => { e.stopPropagation(); exportHistory(); }}><Download size={10} strokeWidth={2}/></button>
                  <button style={S.histActionBtn} title="Importar histórico" onClick={(e) => { e.stopPropagation(); importHistory(); }}><Upload size={10} strokeWidth={2}/></button>
                  <span style={{ fontSize: 9, color: mid, transform: historyOpen ? "rotate(180deg)" : "none", transition: ".2s" }}>▾</span>
                </div>
              </div>
              {historyOpen && (
                <div style={{ maxHeight: 300, overflowY: "auto" }}>
                  {sessionIndex.length > 0 && (
                    <div style={{ padding: "8px 13px 4px" }}>
                      <input
                        value={historySearch}
                        onChange={(e) => setHistorySearch(e.target.value)}
                        placeholder="Buscar por cliente ou palavra..."
                        style={S.historySearchInput}
                      />
                    </div>
                  )}
                  {(() => {
                    const source = adminViewAll && currentUser.papel === "admin" ? adminIndex : sessionIndex;
                    const q = historySearch.trim().toLowerCase();
                    const filtered = q
                      ? source.filter((s) =>
                          (s.clientName || "").toLowerCase().includes(q) ||
                          (s.preview || "").toLowerCase().includes(q) ||
                          (s.clientType || "").toLowerCase().includes(q) ||
                          (s.atendente || "").toLowerCase().includes(q)
                        )
                      : source;
                    if (source.length === 0) {
                      return <div style={{ padding: "12px 13px", fontSize: 9, color: mid2, textAlign: "center" }}>{adminViewAll ? "Nenhuma conversa da equipe ainda." : "Nenhuma conversa salva ainda."}</div>;
                    }
                    if (filtered.length === 0) {
                      return <div style={{ padding: "12px 13px", fontSize: 9, color: mid2, textAlign: "center" }}>Nenhuma conversa encontrada para "{historySearch}".</div>;
                    }
                    return filtered.map((s) => (
                      <div
                        key={s.id}
                        style={S.histItem(s.id === currentSessionId)}
                        onClick={() => loadSession(s.id)}
                      >
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={S.histClient}>
                            {s.clientName || "Cliente"}
                            {adminViewAll && s.atendente ? <span style={S.histAtendente}> · {s.atendente}</span> : null}
                          </div>
                          <div style={S.histPreview}>{s.preview || "Sem mensagens"}</div>
                          <div style={S.histMeta}>{s.msgCount} msgs · {new Date(s.createdAt).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} {new Date(s.createdAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div>
                        </div>
                        <button style={S.histDelete} onClick={(e) => openEditClient(s, e)} title="Editar perfil do cliente"><Pencil size={10} strokeWidth={1.75}/></button>
                        <button style={S.histDelete} onClick={(e) => deleteSession(s.id, e)} title="Excluir"><Trash2 size={10} strokeWidth={1.75}/></button>
                      </div>
                    ));
                  })()}
                </div>
              )}
            </div>
          </aside>

          {/* CHAT */}
          <div style={S.chatArea}>
            <div style={S.toolbar}>
              {mode === "diagnostico" && (
                diagFlow ? (
                  <div style={S.toolItem(true)}>
                    {DIAG_SCRIPTS[diagFlow.category].label} · pergunta {diagFlow.stepIndex + 1}/{DIAG_SCRIPTS[diagFlow.category].questions.length}
                    <span onClick={cancelDiag} style={{ marginLeft: 6, cursor: "pointer", display: "flex" }}><X size={10} strokeWidth={2}/></span>
                  </div>
                ) : (
                  <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                    <span style={{ fontSize: 9, color: "#606060" }}>Iniciar diagnóstico:</span>
                    {DIAG_CATEGORIES.map((c) => (
                      <div key={c.key} style={S.toolItem(false)} onClick={() => startDiag(c.key)}>
                        <c.icon size={11} strokeWidth={1.75}/> {c.label}
                      </div>
                    ))}
                  </div>
                )
              )}
              {selectedKB.length > 0 && (
                <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 9, color: "#606060" }}>Contexto carregado:</span>
                  {selectedKB.map((kb) => (
                    <div key={kb} style={S.toolItem(true)}><CheckCircle2 size={11} strokeWidth={1.75}/> {kb}</div>
                  ))}
                </div>
              )}
              <div style={S.toolItem(true)}><Plug size={11} strokeWidth={1.75}/> IA conectada (Claude)</div>
              {selectedKB.length === 0 && mode === "consulta" && (
                <span style={{ fontSize: 9, color: "#606060" }}>Nenhum contexto carregado</span>
              )}
            </div>            <div style={S.messages}>
              {messages.length === 0 && !busy && (
                <div style={S.emptyState}>
                  <div style={S.emptyIcon}><MessageCircle size={40} strokeWidth={1.25}/></div>
                  <div style={S.emptyTitle}>Comece uma conversa</div>
                  <div style={S.emptyText}>Escreva uma pergunta técnica do cliente, sua resposta, ou anexe fotos da obra/reforma para análise (até {MAX_IMAGES_PER_MSG} por mensagem). Toda a base de conhecimento já está disponível — não precisa selecionar nada.</div>
                </div>
              )}

              {messages.map((msg, idx) => {
                const isUser = msg.role === "user";
                return (
                  <div key={idx} style={{ display: "flex", flexDirection: "column", alignItems: isUser ? "flex-end" : "flex-start", marginBottom: 8, width: "100%" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <div style={S.msgLabel(isUser)}>{isUser ? "Sua Entrada" : "Resposta Gerada"}</div>
                      {!isUser && (
                        <>
                          <button
                            style={S.copyBtn(copiedIdx === idx)}
                            onClick={() => copyMessage(idx, msg.content)}
                            title="Copiar resposta"
                          >
                            {copiedIdx === idx ? <Check size={11} strokeWidth={2}/> : <Copy size={11} strokeWidth={1.75}/>}
                            {copiedIdx === idx ? "Copiado" : "Copiar"}
                          </button>
                          <button
                            style={S.copyBtn(copiedIdx === `wa-${idx}`)}
                            onClick={() => copyForWhatsapp(idx, msg.content)}
                            title="Copiar formatado para WhatsApp"
                          >
                            {copiedIdx === `wa-${idx}` ? <Check size={11} strokeWidth={2}/> : <MessageSquareShare size={11} strokeWidth={1.75}/>}
                            {copiedIdx === `wa-${idx}` ? "Copiado" : "WhatsApp"}
                          </button>
                        </>
                      )}
                    </div>
                    <div style={S.msgBubble(isUser)}>
                      {msg.images && msg.images.length > 0 && (
                        <div style={msg.images.length > 1 ? S.msgImageGrid : undefined}>
                          {msg.images.map((img, i) => (
                            <img
                              key={i}
                              src={img.dataUrl}
                              alt="Foto enviada pelo cliente"
                              style={S.msgImage}
                              onClick={() => window.open(img.dataUrl, "_blank")}
                            />
                          ))}
                        </div>
                      )}
                      {msg.content && (
                        <div style={msg.images && msg.images.length > 0 ? { marginTop: 8 } : undefined}>{esc(msg.content)}</div>
                      )}
                    </div>
                    {msg.metadata && (
                      <div style={S.msgInfo}>
                        <div style={S.infoTitle}>Metadados da Resposta</div>
                        <div style={S.infoItem}><span style={S.infoLabel}>Modo:</span><span>{msg.metadata.mode || "—"}</span></div>
                        <div style={S.infoItem}><span style={S.infoLabel}>KB Usada:</span><span>{msg.metadata.kb || "—"}</span></div>
                        <div style={S.infoItem}><span style={S.infoLabel}>Gerada por:</span><span>{msg.metadata.generatedBy || "—"}</span></div>
                      </div>
                    )}
                  </div>
                );
              })}

              {busy && (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                  <div style={S.msgLabel(false)}>Gerando resposta...</div>
                  <div style={S.typingBubble}>
                    <span style={S.typingDot(0)}/><span style={S.typingDot(220)}/><span style={S.typingDot(440)}/>
                  </div>
                </div>
              )}
              <div ref={msgEndRef}/>
            </div>

            <div style={S.led}/>

            <div style={S.inputArea}>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                multiple
                style={{ display: "none" }}
                onChange={handleImageFileChange}
              />
              {trainingMode && !diagFlow && (
                <div style={S.trainingPanel}>
                  <div style={S.trainingPanelHeader}>
                    <span style={{ display: "flex", alignItems: "center", gap: 5 }}><GraduationCap size={12} strokeWidth={1.75}/> Modo Treino — pratique sem afetar o atendimento real</span>
                    <button style={S.trainingBtn} onClick={generateTrainingQuestion} disabled={busy}>
                      <Dices size={12} strokeWidth={1.75}/> {trainingQuestion ? "Nova pergunta" : "Gerar pergunta de cliente"}
                    </button>
                  </div>
                  {trainingQuestion && (
                    <>
                      <div style={S.trainingQuestionBox}><strong>Cliente (simulado):</strong> {trainingQuestion}</div>
                      <textarea
                        value={trainingAnswer}
                        onChange={(e) => setTrainingAnswer(e.target.value)}
                        placeholder="Escreva aqui a resposta que você daria para esse cliente..."
                        rows={2}
                        style={S.trainingAnswerInput}
                      />
                      <button style={S.trainingSubmitBtn} onClick={submitTrainingAnswer} disabled={!trainingAnswer.trim() || busy}>
                        Avaliar minha resposta
                      </button>
                    </>
                  )}
                  {trainingFeedback && (
                    <div style={S.trainingFeedbackBox}><strong>Feedback:</strong> {trainingFeedback}</div>
                  )}
                </div>
              )}
              {diagFlow && currentDiagQuestion()?.type === "options" ? (
                <div style={S.diagOptionsRow}>
                  {currentDiagQuestion().options.map((opt) => (
                    <button key={opt} style={S.diagOptionBtn} onClick={() => answerDiag(opt)} disabled={busy}>{opt}</button>
                  ))}
                  <button style={S.diagCancelBtn} onClick={cancelDiag} disabled={busy}>Cancelar diagnóstico</button>
                </div>
              ) : (
                <>
                  {imageAttachments.length > 0 && (
                    <div style={S.imagePreviewGrid}>
                      {imageAttachments.map((img, i) => (
                        <div key={i} style={S.imagePreviewRow}>
                          <img src={img.dataUrl} alt="Pré-visualização" style={S.imagePreviewThumb}/>
                          <span style={S.imagePreviewName}>{img.name}</span>
                          <button style={S.imagePreviewRemove} onClick={() => removeImageAttachment(i)} title="Remover imagem"><X size={12} strokeWidth={2}/></button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={S.inputRow}>
                    <button
                      style={S.attachBtn}
                      onClick={openImagePicker}
                      disabled={busy || imageAttachments.length >= MAX_IMAGES_PER_MSG}
                      title={imageAttachments.length >= MAX_IMAGES_PER_MSG ? `Máximo de ${MAX_IMAGES_PER_MSG} fotos por mensagem` : "Anexar foto(s) da obra/reforma do cliente"}
                    >
                      <Camera size={16} strokeWidth={1.75}/>
                    </button>
                    <textarea
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={diagFlow ? "Digite sua resposta..." : (imageAttachments.length > 0 ? "Descreva a dúvida sobre a(s) foto(s) (opcional)..." : "Escreva a pergunta do cliente ou sua resposta...")}
                      rows={1}
                      style={S.msgInput}
                    />
                    <button style={S.sendBtn(sendActive)} disabled={!sendActive} onClick={send}><Send size={16} strokeWidth={1.75}/></button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>

        <div style={S.led}/>
        <footer style={S.footer}>
          <span>Bruto Cerâmica — Ferramenta de Atendimento Técnico</span>
          <span>✓ Claude (Sonnet 5) · {client.name !== "Cliente" ? client.name : "Cliente genérico"}</span>
        </footer>
      </div>

      {/* MODAL CLIENTE */}
      {clientModalOpen && (
        <div style={S.modalOverlay} onClick={() => setClientModalOpen(false)}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setClientModalOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Editar Perfil do Cliente</div>

            <div style={S.formGroup}>
              <label style={S.formLabel}>Nome</label>
              <input style={S.formInput} value={tmpClient.name} onChange={(e) => setTmpClient({ ...tmpClient, name: e.target.value })} placeholder="Ex: João Silva"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Telefone</label>
              <input style={S.formInput} value={tmpClient.phone || ""} onChange={(e) => setTmpClient({ ...tmpClient, phone: e.target.value })} placeholder="Ex: (11) 99999-9999"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Tipo de Cliente</label>
              <select style={S.formInput} value={tmpClient.type} onChange={(e) => setTmpClient({ ...tmpClient, type: e.target.value })}>
                <option value="">Selecionar...</option>
                <option value="arquiteto">Arquiteto/Designer</option>
                <option value="construtor">Construtor</option>
                <option value="revendedor">Revendedor</option>
                <option value="residencial">Residencial (DIY)</option>
                <option value="comercial">Comercial</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Projeto (opcional)</label>
              <input style={S.formInput} value={tmpClient.project} onChange={(e) => setTmpClient({ ...tmpClient, project: e.target.value })} placeholder="Ex: Casa moderna em São Paulo"/>
            </div>
            <button style={S.formButton} onClick={saveClient}>Salvar Perfil</button>
          </div>
        </div>
      )}

      {/* MODAL EDITAR PERFIL DE UMA CONVERSA DO HISTÓRICO (sem abrir a conversa) */}
      {editClientModal && (
        <div style={S.modalOverlay} onClick={() => { setEditClientModal(null); setEditClientFull(null); }}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => { setEditClientModal(null); setEditClientFull(null); }}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Editar Perfil do Cliente</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Ajusta só os dados do lead nessa conversa salva — não abre nem altera as mensagens.
            </p>

            <div style={S.formGroup}>
              <label style={S.formLabel}>Nome</label>
              <input style={S.formInput} value={editClientModal.name} onChange={(e) => setEditClientModal({ ...editClientModal, name: e.target.value })} placeholder="Ex: João Silva"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Telefone</label>
              <input style={S.formInput} value={editClientModal.phone || ""} onChange={(e) => setEditClientModal({ ...editClientModal, phone: e.target.value })} placeholder="Ex: (11) 99999-9999"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Tipo de Cliente</label>
              <select style={S.formInput} value={editClientModal.type} onChange={(e) => setEditClientModal({ ...editClientModal, type: e.target.value })}>
                <option value="">Selecionar...</option>
                <option value="arquiteto">Arquiteto/Designer</option>
                <option value="construtor">Construtor</option>
                <option value="revendedor">Revendedor</option>
                <option value="residencial">Residencial (DIY)</option>
                <option value="comercial">Comercial</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Projeto (opcional)</label>
              <input style={S.formInput} value={editClientModal.project} onChange={(e) => setEditClientModal({ ...editClientModal, project: e.target.value })} placeholder="Ex: Casa moderna em São Paulo"/>
            </div>
            {editClientErr && <div style={{ fontSize: 11, color: "#F09595", marginBottom: 10 }}>{editClientErr}</div>}
            <button style={{ ...S.formButton, opacity: editClientBusy ? 0.6 : 1 }} onClick={saveEditClient} disabled={editClientBusy}>
              {editClientBusy ? "Salvando..." : "Salvar Perfil"}
            </button>
          </div>
        </div>
      )}

      {/* MODAL EXPORTAR */}
      {exportModal && (
        <div style={S.modalOverlay} onClick={() => setExportModal(null)}>
          <div style={{ ...S.modalContent, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setExportModal(null)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Exportar Histórico</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              O download direto não é suportado neste ambiente. <strong style={{ color: white }}>Copie o JSON abaixo</strong>, cole num editor de texto e salve como <code style={{ color: teal }}>.json</code>.
            </p>
            <textarea
              readOnly
              value={exportModal}
              onClick={(e) => e.target.select()}
              style={{ ...S.formInput, fontFamily: "monospace", fontSize: 10, height: 220, resize: "none", lineHeight: 1.5 }}
            />
            <ExportCopyBtn text={exportModal} label="Copiar JSON"/>
          </div>
        </div>
      )}

      {/* MODAL RECOMENDADOR POR PROJETO */}
      {recommendModalOpen && (
        <div style={S.modalOverlay} onClick={() => setRecommendModalOpen(false)}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setRecommendModalOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Recomendar Linha para o Projeto</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Descreva o projeto com as palavras do cliente — a IA recomenda a linha e o produto certo, sem você precisar saber os nomes técnicos.
            </p>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Descrição do projeto</label>
              <textarea
                value={recommendText}
                onChange={(e) => setRecommendText(e.target.value)}
                placeholder="Ex: fachada moderna com destaque na entrada, ou área gourmet rústica externa..."
                rows={4}
                style={{ ...S.formInput, resize: "none" }}
              />
            </div>
            <button style={S.formButton} onClick={submitRecommend} disabled={!recommendText.trim() || busy}>Gerar Recomendação</button>
          </div>
        </div>
      )}

      {/* MODAL RESUMO PARA WHATSAPP */}
      {handoffModal && (
        <div style={S.modalOverlay} onClick={() => setHandoffModal(null)}>
          <div style={{ ...S.modalContent, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setHandoffModal(null)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Resumo do Atendimento</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Copie e cole no WhatsApp para o consultor dar continuidade sem perder contexto.
            </p>
            <textarea
              readOnly
              value={handoffModal}
              onClick={(e) => e.target.select()}
              style={{ ...S.formInput, fontFamily: "monospace", fontSize: 10.5, height: 220, resize: "none", lineHeight: 1.5 }}
            />
            <ExportCopyBtn text={handoffModal} label="Copiar Resumo"/>
          </div>
        </div>
      )}

      {/* MODAL GESTÃO DE USUÁRIOS (admin) */}
      {userMgmtOpen && (
        <div style={S.modalOverlay} onClick={() => setUserMgmtOpen(false)}>
          <div style={{ ...S.modalContent, maxWidth: 480 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setUserMgmtOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Gestão de Usuários</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Isso cadastra a pessoa <strong style={{ color: white }}>dentro da ferramenta</strong> (nome e papel). A senha de acesso é separada — crie/edite primeiro em
              {" "}<strong style={{ color: white }}>hPanel → Site → Avançado → Diretórios protegidos</strong>, usando o mesmo nome de usuário.
            </p>

            <div style={{ marginBottom: 16, paddingBottom: 14, borderBottom: `1px solid ${border}` }}>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Usuário (igual ao do Basic Auth)</label>
                <input style={S.formInput} value={newUserUsuario} onChange={(e) => setNewUserUsuario(e.target.value)} placeholder="ex: maria"/>
              </div>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Nome</label>
                <input style={S.formInput} value={newUserNome} onChange={(e) => setNewUserNome(e.target.value)} placeholder="ex: Maria Souza"/>
              </div>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Papel</label>
                <select style={S.formInput} value={newUserPapel} onChange={(e) => setNewUserPapel(e.target.value)}>
                  <option value="atendente">Atendente</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              {userMgmtErr && <div style={{ fontSize: 11, color: "#F09595", marginBottom: 10 }}>{userMgmtErr}</div>}
              <button style={{ ...S.formButton, opacity: (userMgmtBusy || !newUserUsuario.trim() || !newUserNome.trim()) ? 0.6 : 1 }} onClick={submitNewUser} disabled={userMgmtBusy || !newUserUsuario.trim() || !newUserNome.trim()}>
                Cadastrar usuário
              </button>
            </div>

            <div style={S.formLabel}>Equipe atual</div>
            <div style={{ maxHeight: 240, overflowY: "auto", marginTop: 8 }}>
              {userMgmtList.length === 0 && <div style={{ fontSize: 11, color: mid2 }}>Nenhum usuário cadastrado ainda.</div>}
              {userMgmtList.map((u) => (
                <div key={u.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid rgba(46,46,46,.5)` }}>
                  <div>
                    <div style={{ fontSize: 12, color: white, fontWeight: 600 }}>{u.nome} {u.papel === "admin" ? "★" : ""}</div>
                    <div style={{ fontSize: 10, color: mid2 }}>{u.usuario} · {u.ativo ? "ativo" : "desativado"}</div>
                  </div>
                  <button
                    style={{ ...S.histActionBtn, opacity: userMgmtBusy ? 0.5 : 1 }}
                    disabled={userMgmtBusy}
                    onClick={() => toggleUserActive(u.id, !u.ativo)}
                  >
                    {u.ativo ? "Desativar" : "Reativar"}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
