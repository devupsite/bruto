// Endpoint do back-end PHP que repassa a chamada pra API da Anthropic.
// Caminho relativo: funciona automaticamente desde que o chat.php

const API_ENDPOINT = "api/chat.php";

// Helper das chamadas de histórico/auth no servidor (historico.php, login.php, etc.)
async function apiCall(endpoint, payload) {
  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify(payload || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
  return data;
}

// window.storage só existe dentro do sandbox de artifacts do Claude.ai.
// Fora dele, este "storage" reproduz a mesma API (get/set/delete/list)
// usando localStorage do navegador, para o resto do código não precisar
// mudar nada além desta troca (storage.* → storage.*).
const storage = {
  async get(key) {
    const v = window.localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = Object.keys(window.localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys };
  },
};

  instalacao: `INSTALAÇÃO — GUIA TÉCNICO COMPLETO

1. PREPARAÇÃO DA BASE
Superfície limpa, nivelada, sem poeira, gordura ou resíduos de tinta. Em reboco novo, aguardar cura completa: 21–28 dias antes de aplicar. Superfícies lisas ou pintadas com tinta PVA precisam de chapisco ou primer específico — pular esse passo é o erro mais comum e mais caro de corrigir depois (o tijolinho pode soltar meses depois).

2. ARGAMASSA
Usar AC-II ou AC-III — nunca AC-I (uso geral), que não tem aderência suficiente para o peso do tijolinho artesanal. Seguir proporções da embalagem; excesso de água dilui o adesivo e reduz a resistência da colagem. Teste: a mistura deve escorregar levemente mas não pingar da desempenadeira.

3. ASSENTAMENTO
Aplicar com desempenadeira dentada, trabalhando em seções de no máximo 60×60cm (a argamassa tem tempo de trabalho de 20–30 min, menor em dias quentes/com vento). Usar espaçadores para juntas uniformes.

4. MISTURA DE LOTES (CRÍTICO PARA O BRICK)
Abrir pelo menos 3 caixas diferentes antes de começar e misturar as peças aleatoriamente. Aplicar uma caixa por vez cria blocos de cor visíveis ("efeito remendado") — variação entre queimas é natural e esperada no artesanal.

5. REJUNTE
Aguardar cura da argamassa: 24h em condições normais, até 72h em ambientes úmidos/frios. Remover excesso com esponja levemente úmida antes de secar por completo — depois de curado, a limpeza exige produtos ácidos que agridem a peça.

6. SELAGEM
Aplicar impermeabilizante específico para cerâmica porosa após a cura total do rejunte. Facilita limpeza e protege contra manchas/umidade.

Regra de escalonamento: se a irregularidade da superfície passar de 5mm, houver problema estrutural na parede, ou desnível acentuado em piso, recomende um instalador especializado — não tente resolver via atendimento remoto.`,

  paginacoes: `PAGINAÇÕES — 25 PADRÕES DE ASSENTAMENTO (LINHA BRICK)

Dificuldade de execução (Fácil / Médio / Avançado) reflete tempo de mão de obra e índice de perda esperado — não a qualidade do resultado. Padrões avançados exigem mais corte de peça e mais atenção do instalador, mas alcançam efeitos que padrões simples não conseguem. Organizados em 4 famílias:

FAMÍLIA CORRIDO — deslocamento progressivo entre fiadas, base de qualquer paginação bem executada:

FAMÍLIA GEOMÉTRICO — ângulos, rotações e módulos, maior impacto visual:

- Diagonal (avançado): amarrado aplicado em 30° ou 45°, dinamiza o espaço, rompe a horizontalidade tradicional. Parede, destaque.

- Losango (avançado): amarrado girado 45°, forma losangos entre as juntas, efeito dinâmico e elegante, especialmente em paredes de destaque internas.
- Diagonal Cruzada (avançado): duas camadas em diagonais opostas (+30°/-30°) sobrepostas, trama visual complexa, exclusivo para painéis decorativos e instalações artísticas.
- Escama (médio): peças quadradas sobrepostas em offset diagonal, imita escamas de peixe, alto valor decorativo, comum em design de interiores. Interno.

FAMÍLIA ESPECIAL — fogem da grade tradicional para efeitos específicos de projeto:

- Misto (avançado): alterna fiadas horizontais e verticais, dois planos de textura distintos, alto valor decorativo e exclusividade. Destaque.
- Aleatório (médio): peças em comprimentos variados sem padrão fixo de offset, imita irregularidade de alvenarias antigas e rústicas, resultado orgânico. Interno, rústico.

Regra de atendimento: paginação é decisão estética e de mão de obra, não muda a resistência técnica do produto (isso vem do bloco INSTALAÇÃO). Ao recomendar, cruze o nível de dificuldade com a experiência do instalador do cliente — se ele mesmo for aplicar e for padrão avançado (Espinha de Peixe, Diagonal, Cata-vento, Losango, Diagonal Cruzada, Inglês Cruzado, Monge, Gótico, Misto), avise que recomenda mão de obra especializada por causa do corte de peça e do índice de perda maior. Para fachada externa e alta resistência, priorize Amarrado Tradicional, Flandrês, Americano ou Inglês. Para parede de destaque interna, os geométricos (Espinha de Peixe, Losango, Cata-vento) costumam ser a escolha de maior impacto. O guia completo com ilustração de cada padrão está disponível em guia-paginacoes-bruto.pdf, linkado na página de Paginações do site.`,

  manutencao: `MANUTENÇÃO E LIMPEZA — PISO E PAREDE CERÂMICA

DIA A DIA: água morna + sabão neutro, mop/pano de microfibra levemente úmido. Evitar poças de água paradas (pode manchar rejunte e comprometer impermeabilização). Capacho na entrada + varrição com cerdas macias evita que areia/partículas risquem a textura.

LIMPEZA SEMANAL: água morna + detergente neutro diluído, esfregão de cerdas MÉDIAS (nunca metálicas). Atenção redobrada nas juntas de rejunte. Enxaguar bem — resíduo de detergente atrai mais sujeira.

MANCHAS DE GORDURA (área gourmet): bicarbonato de sódio direto na mancha úmida, aguardar 10 min, esfregar com esponja macia.

PRODUTOS A EVITAR (sempre):
✗ Ácidos — limpa-pedras, ácido muriático, vinagre, limão: dissolvem o rejunte e podem manchar peças permanentemente
✗ Abrasivos — palha de aço, esponjas duras: riscam o acabamento
✗ Hipoclorito / água sanitária: desbota o rejunte e pode manchar peças de tom mais quente

IMPERMEABILIZAÇÃO: renovar a cada 12–18 meses (mais crítico em áreas externas expostas a sol/chuva). Cria camada protetora que reduz absorção de líquidos e manchas. Ver bloco INDICAÇÕES DE PRODUTOS abaixo pra recomendação específica.

MANCHAS ANTIGAS / PROFUNDAS: produtos específicos para cerâmica porosa disponíveis em lojas especializadas. Em dano profundo que já penetrou a peça, a solução mais garantida é substituição pontual — por isso sempre recomende ao cliente guardar peças excedentes do pedido original.`,

LIMPEZA PESADA PÓS-OBRA / MANCHAS ANTIGAS DE CIMENTO E ARGAMASSA (todas as linhas):

  benchmark: `REGRAS UNIVERSAIS DO SETOR (BENCHMARK — NÃO É DADO EXCLUSIVO DA BRUTO)

1. ÁGUA E PISCINA
Peça artesanal porosa (Brick, Rockface, a maioria dos cimentícios) NÃO deve ser aplicada submersa (revestimento interno de piscina). Uso submerso exige classe de absorção de água muito baixa (referência do setor: NBR/ISO grupo BIa). Essas linhas servem bem para borda, deck e entorno de piscina — nunca para a parte que fica dentro d'água.

4. ESCORREGAMENTO EM PISO (só relevante se a linha for usada em piso)
Área molhada exige coeficiente de atrito mais alto (referência do setor: classificação R10 ou superior). Área seca interna tolera valores menores. Isso não é uma característica atual do catálogo Bruto (hoje é revestimento de parede), mas vale documentar caso a linha se expanda.

5. EFLORESCÊNCIA (MANCHAS ESBRANQUIÇADAS)
Em cimentício ou brick aplicado externamente, pode aparecer uma mancha esbranquiçada nos primeiros meses — são sais minerais migrando de dentro da argamassa para a superfície durante a cura, um fenômeno do SETOR, não defeito do produto. Tende a reduzir com limpeza (água e escova macia) e o tempo. Se persistir por mais de 6-12 meses ou piorar, aí sim vale escalar para análise.

function ExportCopyBtn({ text, label = "Copiar JSON" }) {
  const [copied, setCopied] = useState(false);
  async function copy() {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {}
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        Object.assign(ta.style, { position: "fixed", top: 0, left: 0, opacity: 0 });
        document.body.appendChild(ta);
        ta.focus(); ta.setSelectionRange(0, ta.value.length);
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (_) {}
    }
    if (ok) { setCopied(true); setTimeout(() => setCopied(false), 2000); }
  }
  return (
    <button onClick={copy} style={{ marginTop: 10, width: "100%", padding: 10, border: "none", borderRadius: 6, background: copied ? "#4ADE80" : "#57999B", color: "#0F0F0F", fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans', sans-serif", fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
      {copied ? <><Check size={14} strokeWidth={2.5}/> Copiado!</> : <><Copy size={14} strokeWidth={1.75}/> {label}</>}
    </button>
  );
}

  // ── AUTENTICAÇÃO ────────────────────────────────────────────────────
  // A senha já foi conferida pelo Apache (HTTP Basic Auth, .htaccess na raiz
  // do subdomínio) antes desta página sequer carregar. Aqui só perguntamos
  // "quem é essa pessoa" (api/me.php lê $_SERVER['PHP_AUTH_USER']) e, se ela

  // ── Carga inicial: descobre quem está autenticado e carrega histórico ──
  useEffect(() => {
    (async () => {
      try {
        const me = await apiCall("api/me.php", {});
        setCurrentUser({ nome: me.nome, papel: me.papel, usuario: me.usuario });
      } catch (e) {
        setAuthError({ status: e.status || 0, message: e.message || "Não foi possível confirmar seu acesso." });
      } finally {
        setAuthChecked(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    (async () => {
      // Índice local (cache rápido)
      let localIndex = [];
      try {
        const res = await storage.get("session-index");
        if (res?.value) localIndex = JSON.parse(res.value);
      } catch (_) {}
      // Índice do servidor (fonte da verdade) — mescla, servidor tem prioridade
      try {
        const data = await apiCall("api/historico.php", { acao: "listar" });
        const serverIds = new Set(data.sessoes.map((s) => s.id));
        const merged = [...data.sessoes, ...localIndex.filter((l) => !serverIds.has(l.id))];
        setSessionIndex(merged);
      } catch (_) {
        setSessionIndex(localIndex); // offline/erro: segue com o cache local
      }
    })();
  }, [currentUser]);

  // Basic Auth não tem logout nativo — este é um truque de melhor esforço
  // (nem todo navegador honra), por isso o botão avisa isso no título.
  async function doLogout() {
    try {
      await fetch("api/me.php", { headers: { Authorization: "Basic " + btoa("logout:logout") } });
    } catch (_) {}
    alert("Se o navegador não pedir login de novo, feche todas as abas do site para trocar de usuário — Basic Auth não tem um logout garantido.");
  }

    const next = !adminViewAll;
    setAdminViewAll(next);
    if (next && currentUser?.papel === "admin") {
      try {
        const data = await apiCall("api/historico.php", { acao: "listar", todos: true });
        setAdminIndex(data.sessoes);

  async function openUserMgmt() {
    setUserMgmtOpen(true);
    setUserMgmtErr("");

      const data = await apiCall("api/usuarios.php", { acao: "listar" });

      setUserMgmtErr(e.message || "Não consegui carregar a lista de usuários.");

  async function submitNewUser() {
    const usuario = newUserUsuario.trim().toLowerCase();
    const nome = newUserNome.trim();
    if (!usuario || !nome || userMgmtBusy) return;
    setUserMgmtBusy(true);
    setUserMgmtErr("");
    try {
      await apiCall("api/usuarios.php", { acao: "criar", usuario, nome, papel: newUserPapel });
      setNewUserUsuario("");
      setNewUserNome("");
      setNewUserPapel("atendente");
      await refreshUserMgmtList();
    } catch (e) {
      setUserMgmtErr(e.message || "Não consegui cadastrar esse usuário.");
    } finally {
      setUserMgmtBusy(false);
    }
  }

  async function toggleUserActive(id, activate) {
    setUserMgmtBusy(true);
    setUserMgmtErr("");
    try {
      await apiCall("api/usuarios.php", { acao: activate ? "reativar" : "desativar", id });
      await refreshUserMgmtList();
    } catch (e) {
      setUserMgmtErr(e.message || "Não consegui atualizar esse usuário.");
    } finally {
      setUserMgmtBusy(false);
    }
  }

  // ── Auto-save: persiste sessão corrente 800ms após cada mudança ────
  useEffect(() => {
    if (messages.length === 0) return;
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => persistSession(messages, client), 800);
    return () => clearTimeout(saveTimerRef.current);
  }, [messages, client]);

  async function persistSession(msgs, cli) {
    const id = currentSessionId || (() => {
      const newId = `sess_${Date.now()}`;
      setCurrentSessionId(newId);
      return newId;
    })();
    const firstUserMsg = msgs.find((m) => m.role === "user")?.content || "";
    const preview = firstUserMsg.slice(0, 60) + (firstUserMsg.length > 60 ? "…" : "");
    const meta = { id, createdAt: parseInt(id.replace("sess_", "")), clientName: cli.name, clientType: cli.type, preview, msgCount: msgs.length };
    const payload = JSON.stringify({ meta, client: cli, messages: msgs });
    // Cache local primeiro — resposta instantânea, funciona offline
    try {
      await storage.set(`session:${id}`, payload);
      setSessionIndex((prev) => {
        const updated = [meta, ...prev.filter((s) => s.id !== id)].slice(0, 30);
        storage.set("session-index", JSON.stringify(updated));
        return updated;
      });
    } catch (_) {}
    // Servidor depois — armazenamento permanente, por usuário (não bloqueia a interface)
    try {
      await apiCall("api/historico.php", {
        acao: "salvar",
        id,
        clienteNome: cli.name,
        clienteTipo: cli.type,
        preview,
        msgCount: msgs.length,
        criadoEm: meta.createdAt,
        payload,
      });
    } catch (_) { /* offline/erro: o cache local garante; sincroniza no próximo save */ }
  }

  async function startNewSession() {
    setMessages([]);
    setInput("");
    setDiagFlow(null);
    setSelectedKB([]);
    setClient({ name: "Cliente", type: "", project: "", phone: "", tags: ["Consulta Técnica"] });
    setCurrentSessionId(null);
  }

  async function loadSession(id) {
    let parsed = null;
    // Servidor primeiro (fonte da verdade e única fonte para admin vendo sessões de outros)
    try {
      const data = await apiCall("api/historico.php", { acao: "obter", id });
      if (data?.payload) parsed = JSON.parse(data.payload);
    } catch (_) {}
    // Fallback local
    if (!parsed) {
      try {
        const res = await storage.get(`session:${id}`);
        if (res?.value) parsed = JSON.parse(res.value);
      } catch (_) {}
    }
    if (!parsed) return;
    try {
      const { client: cli, messages: msgs } = parsed;
      setClient(cli);
      setMessages(msgs);
      setCurrentSessionId(id);
      setDiagFlow(null);
      setInput("");
      setHistoryOpen(false);
    } catch (_) {}
  }

  async function deleteSession(id, e) {
    e.stopPropagation();
    try {
      await storage.delete(`session:${id}`);
      setSessionIndex((prev) => {
        const updated = prev.filter((s) => s.id !== id);
        storage.set("session-index", JSON.stringify(updated));
        return updated;
      });
      if (currentSessionId === id) startNewSession();
    } catch (_) {}
    try {
      await apiCall("api/historico.php", { acao: "excluir", id });
      setAdminIndex((prev) => prev.filter((s) => s.id !== id));
    } catch (_) {}
  }

  // ── Editar só o perfil do cliente de uma sessão salva, sem abrir a conversa ──
  async function openEditClient(sessionMeta, e) {
    if (e) e.stopPropagation();
    setEditClientErr("");
    setEditClientBusy(true);
    let parsed = null;
    try {
      const data = await apiCall("api/historico.php", { acao: "obter", id: sessionMeta.id });
      if (data?.payload) parsed = JSON.parse(data.payload);
    } catch (_) {}
    if (!parsed) {
      try {
        const res = await storage.get(`session:${sessionMeta.id}`);
        if (res?.value) parsed = JSON.parse(res.value);
      } catch (_) {}
    }
    setEditClientBusy(false);
    if (!parsed) {
      alert("Não consegui carregar essa conversa pra editar o perfil.");
      return;
    }
    setEditClientFull(parsed);
    setEditClientModal({
      id: sessionMeta.id,
      name: parsed.client?.name || "",
      phone: parsed.client?.phone || "",
      type: parsed.client?.type || "",
      project: parsed.client?.project || "",
    });
  }

  async function saveEditClient() {
    if (!editClientModal || !editClientFull || editClientBusy) return;
    setEditClientBusy(true);
    setEditClientErr("");
    const updatedClient = {
      ...editClientFull.client,
      name: editClientModal.name.trim() || "Cliente",
      phone: editClientModal.phone.trim(),
      type: editClientModal.type,
      project: editClientModal.project.trim(),
    };
    const updatedPayload = { ...editClientFull, client: updatedClient };
    const payloadStr = JSON.stringify(updatedPayload);
    try {
      await apiCall("api/historico.php", {
        acao: "salvar",
        id: editClientModal.id,
        clienteNome: updatedClient.name,
        clienteTipo: updatedClient.type,
        preview: editClientFull.meta?.preview || "",
        msgCount: (editClientFull.messages || []).length,
        criadoEm: editClientFull.meta?.createdAt || 0,
        payload: payloadStr,
      });
      try { await storage.set(`session:${editClientModal.id}`, payloadStr); } catch (_) {}

      const patch = (s) => s.id === editClientModal.id
        ? { ...s, clientName: updatedClient.name, clientType: updatedClient.type }
        : s;
      setSessionIndex((prev) => prev.map(patch));
      setAdminIndex((prev) => prev.map(patch));
      if (currentSessionId === editClientModal.id) setClient(updatedClient);

      setEditClientModal(null);
      setEditClientFull(null);
    } catch (e) {
      setEditClientErr(e.message || "Não consegui salvar as alterações.");
    } finally {
      setEditClientBusy(false);
    }
  }

  const NOME_TEMA = {
    frete: "Frete & Entrega", instalacao: "Instalação", devolucao: "Devolução & Garantia",
    qualidade: "Qualidade & Variação", comparacao: "Comparação de Produtos", preco: "Preço & Pagamento",
    produto: "Dúvida sobre Produto", manutencao: "Manutenção & Limpeza", geral: "Geral",
  };

  async function carregarTemas() {
    setTemasBusy(true);
    setTemasModalOpen(true);
    try {
      // Mesma fonte usada pelo export: o que já está na tela (servidor + local mesclados)
      const index = adminViewAll && currentUser.papel === "admin" ? adminIndex : sessionIndex;
      const contagem = {};
      let totalRespostas = 0, semTema = 0;
      let janela30dOk = 0;
      const agora = Date.now();
      const trintaDias = 30 * 24 * 60 * 60 * 1000;

      for (const s of index) {
        let parsed = null;
        try {
          const data = await apiCall("api/historico.php", { acao: "obter", id: s.id });
          if (data?.payload) parsed = JSON.parse(data.payload);
        } catch (_) {}
        if (!parsed) {
          try {
            const res = await storage.get(`session:${s.id}`);
            if (res?.value) parsed = JSON.parse(res.value);
          } catch (_) {}
        }
        if (!parsed?.messages) continue;
        for (const m of parsed.messages) {
          if (m.role !== "assistant" || !m.metadata) continue;
          if (m.metadata.mode === "error" || m.metadata.generatedBy?.includes("roteiro fixo") || m.metadata.generatedBy?.includes("sem IA")) continue;
          totalRespostas++;
          const dentroJanela = (agora - (s.createdAt || 0)) <= trintaDias;
          if (dentroJanela) janela30dOk++;
          if (m.metadata.tema) {
            contagem[m.metadata.tema] = (contagem[m.metadata.tema] || 0) + 1;
          } else {
            semTema++;
          }
        }
      }

      const ranking = Object.entries(contagem)
        .sort((a, b) => b[1] - a[1])
        .map(([tema, n]) => ({ tema, nome: NOME_TEMA[tema] || tema, n, pct: totalRespostas > 0 ? (n / totalRespostas) * 100 : 0 }));

      setTemasData({ ranking, totalRespostas, semTema, sessoesAnalisadas: index.length });
    } catch (e) {
      setTemasData({ erro: e.message });
    } finally {
      setTemasBusy(false);
    }
  }

  async function exportHistory() {
    try {
      // Fonte da lista: o que já está na tela (servidor + local mesclados),
      // não só o cache local — senão perde sessões de outros dispositivos/abas.
      const index = adminViewAll && currentUser.papel === "admin" ? adminIndex : sessionIndex;

      if (index.length === 0) { alert("Nenhuma sessão para exportar."); return; }

      const sessions = [];
      for (const s of index) {
        let parsed = null;
        try {
          const data = await apiCall("api/historico.php", { acao: "obter", id: s.id });
          if (data?.payload) parsed = JSON.parse(data.payload);
        } catch (_) {}
        if (!parsed) {
          try {
            const res = await storage.get(`session:${s.id}`);
            if (res?.value) parsed = JSON.parse(res.value);
          } catch (_) {}
        }
        if (parsed) sessions.push(parsed);
      }

      if (sessions.length === 0) { alert("Não consegui carregar nenhuma sessão do servidor ou do cache local para exportar."); return; }

      const json = JSON.stringify({ version: 1, exportedAt: Date.now(), sessions }, null, 2);
      setExportModal({ content: json, ext: "json" });
    } catch (e) { alert(`Erro ao exportar: ${e.message}`); }
  }

  // ── Exportação legível (HTML) ────────────────────────────────────
  // Mesma fonte de dados do exportHistory (JSON), mas monta um
  // documento HTML autocontido com a mesma cara do chat da ferramenta
  // — pra ler/arquivar/imprimir sem precisar interpretar JSON cru.
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function formatarData(ms) {
    return new Date(ms).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function buildReadableHtml(sessions, exportedAt) {
    const totalMsgs = sessions.reduce((acc, s) => acc + (s.meta?.msgCount || s.messages.length), 0);

    const sessionsHtml = sessions.map((s) => {
      const meta = s.meta || {};
      const client = s.client || {};
      const tags = (client.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const infoBits = [client.type, client.project ? `Projeto: ${client.project}` : null, client.phone]
        .filter(Boolean).map(escapeHtml).join(" · ");

      const msgsHtml = s.messages.map((m) => {
        const isUser = m.role === "user";
        const label = isUser ? "Cliente" : "Assistente";
        let imgsHtml = "";
        if (m.images && m.images.length) {
          imgsHtml = m.images.map((img) => `<img class="msg-img" src="${img.dataUrl}">`).join("");
        }
        let metaHtml = "";
        if (!isUser && m.metadata) {
          const md = m.metadata;
          metaHtml = `<div class="msg-info">
            <div class="info-title">Detalhes da geração</div>
            <div class="info-item"><span class="info-label">Modo</span>${escapeHtml(md.mode)}</div>
            <div class="info-item"><span class="info-label">Base de conhecimento</span>${escapeHtml(md.kb)}</div>
            <div class="info-item"><span class="info-label">Gerado por</span>${escapeHtml(md.generatedBy)}</div>
          </div>`;
        }
        return `<div class="msg-row ${isUser ? "user" : "assistant"}">
          <div class="msg-label">${label}</div>
          <div class="msg-bubble ${isUser ? "user" : "assistant"}">${escapeHtml(m.content)}${imgsHtml}</div>
          ${metaHtml}
        </div>`;
      }).join("");

      return `<section class="session">
        <div class="session-header">
          <div class="session-client">
            <div class="client-name">${escapeHtml(meta.clientName || "Cliente")}</div>
            <div class="client-info">${infoBits}</div>
          </div>
          <div class="session-meta">
            <div class="session-date">${formatarData(meta.createdAt)}</div>
            <div class="session-tags">${tags}</div>
          </div>
        </div>
        <div class="messages">${msgsHtml}</div>
      </section>`;
    }).join("");

    return `<!DOCTYPE html>

  async function exportHistoryReadable() {
    // Abre a aba já dentro do clique do usuário — evita bloqueio de
    // pop-up, já que o carregamento das sessões abaixo é assíncrono.
    const janela = window.open("", "_blank");
    try {
      const index = adminViewAll && currentUser.papel === "admin" ? adminIndex : sessionIndex;
      if (index.length === 0) {
        if (janela) janela.close();
        alert("Nenhuma sessão para exportar.");
        return;
      }

      const sessions = [];
      for (const s of index) {
        let parsed = null;
        try {
          const data = await apiCall("api/historico.php", { acao: "obter", id: s.id });
          if (data?.payload) parsed = JSON.parse(data.payload);
        } catch (_) {}
        if (!parsed) {
          try {
            const res = await storage.get(`session:${s.id}`);
            if (res?.value) parsed = JSON.parse(res.value);
          } catch (_) {}
        }
        if (parsed) sessions.push(parsed);
      }

      if (sessions.length === 0) {
        if (janela) janela.close();
        alert("Não consegui carregar nenhuma sessão do servidor ou do cache local para exportar.");
        return;
      }

      const htmlDoc = buildReadableHtml(sessions, Date.now());

      if (janela && !janela.closed) {
        janela.document.open();
        janela.document.write(htmlDoc);
        janela.document.close();
      } else {
        // pop-up bloqueado — cai no mesmo modal de copiar/colar já
        // usado pra exportação em JSON, só que com o HTML pronto.
        setExportModal({ content: htmlDoc, ext: "html" });
      }
    } catch (e) {
      if (janela) janela.close();
      alert(`Erro ao exportar leitura: ${e.message}`);
    }
  }

  function importHistory() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    // Precisa estar no DOM para funcionar em iframe
    Object.assign(input.style, { position: "fixed", opacity: 0, pointerEvents: "none" });
    document.body.appendChild(input);

    const cleanup = () => { try { document.body.removeChild(input); } catch (_) {} };

    input.oncancel = cleanup;
    input.onchange = async (e) => {
      const file = e.target.files[0];
      cleanup();
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const sessions = parsed?.sessions;
        if (!Array.isArray(sessions) || sessions.length === 0)
          throw new Error("Arquivo sem sessões válidas");

        const newMetas = [];
        for (const s of sessions) {
          if (!s?.meta?.id || !Array.isArray(s?.messages)) continue;
          await storage.set(`session:${s.meta.id}`, JSON.stringify(s));
          newMetas.push(s.meta);
        }
        if (newMetas.length === 0) throw new Error("Nenhuma sessão válida encontrada");

        // Lê índice atual direto do storage (evita closure stale do state)
        let existingIndex = [];
        try {
          const idxRes = await storage.get("session-index");
          if (idxRes?.value) existingIndex = JSON.parse(idxRes.value);
        } catch (_) {}

        const merged = [
          ...newMetas,
          ...existingIndex.filter((p) => !newMetas.find((n) => n.id === p.id)),
        ].slice(0, 30);
        await storage.set("session-index", JSON.stringify(merged));
        setSessionIndex(merged);
        setHistoryOpen(true);
        alert(`${newMetas.length} sessão(ões) importada(s) com sucesso.`);
      } catch (err) { alert(`Erro ao importar: ${err.message}`); }
    };

    input.click();
  }

  // ── ANEXO DE FOTO (obra/reforma do lead) — suporta várias por mensagem ──
  const MAX_IMAGES_PER_MSG = 4;
  const MAX_IMAGE_SIZE = 1.5 * 1024 * 1024; // 1.5MB por foto (várias fotos por mensagem somam rápido)

  function openImagePicker() {
    fileInputRef.current?.click();
  }

  function handleImageFileChange(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = ""; // permite selecionar os mesmos arquivos de novo depois
    if (files.length === 0) return;

    const remaining = MAX_IMAGES_PER_MSG - imageAttachments.length;
    if (remaining <= 0) {
      alert(`Máximo de ${MAX_IMAGES_PER_MSG} fotos por mensagem.`);
      return;
    }
    const toProcess = files.slice(0, remaining);
    if (files.length > remaining) {
      alert(`Só dá pra anexar mais ${remaining} foto(s) nesta mensagem (máximo ${MAX_IMAGES_PER_MSG}). As demais foram ignoradas.`);
    }

    toProcess.forEach((file) => {
      if (!file.type.startsWith("image/")) {
        alert(`"${file.name}" não é uma imagem (JPG, PNG, WEBP...) — ignorada.`);
        return;
      }
      if (file.size > MAX_IMAGE_SIZE) {
        alert(`"${file.name}" é muito grande. Envie fotos de até 1.5MB cada (várias fotos juntas somam rápido no armazenamento da sessão).`);
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        setImageAttachments((prev) =>
          prev.length >= MAX_IMAGES_PER_MSG
            ? prev
            : [...prev, { dataUrl: reader.result, mediaType: file.type, name: file.name }]
        );
      };
      reader.onerror = () => alert(`Não foi possível ler "${file.name}". Tente novamente.`);
      reader.readAsDataURL(file);
    });
  }

  function removeImageAttachment(index) {
    setImageAttachments((prev) => prev.filter((_, i) => i !== index));
  }

  async function copyMessage(idx, text) {
    let ok = false;
    // Tenta clipboard moderno primeiro
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (_) {}

    // Fallback: textarea dentro do iframe com foco forçado
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        Object.assign(ta.style, { position: "fixed", top: 0, left: 0, opacity: 0, pointerEvents: "none" });
        document.body.appendChild(ta);
        ta.focus({ preventScroll: true });
        ta.setSelectionRange(0, ta.value.length);
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (_) {}
    }

    if (ok) {
      setCopiedIdx(idx);
      setTimeout(() => setCopiedIdx((cur) => (cur === idx ? null : cur)), 1800);
    }
  }

  function buildSystemPrompt() {
    // ── BLOCO ESTÁTICO (cacheável) ──────────────────────────────────
    // Tudo aqui é idêntico em toda chamada, independente de cliente/modo/foco.
    // Marcado com cache_control para a API reaproveitar esse prefixo entre turnos
    // e entre atendimentos — a KB completa é grande, então isso reduz bastante
    // o custo de token em conversas com várias mensagens.
    let staticSys = `Você é especialista técnico de cerâmica e atendimento da Bruto. Responda como alguém respondendo rápido num chat de WhatsApp: direto ao ponto, sem enrolação, sem repetir a pergunta do cliente, sem seções ou listas longas. Máximo 80 palavras — só use mais se a pergunta pedir uma lista curta de itens (ex: passo a passo de instalação). Tom humano e natural, não robótico.\n`;
    staticSys += `\n${KB.escalonamento.trim()}\n`;
    // Toda a base de conhecimento vai sempre no contexto — sem exigir seleção manual.
    // Isso permite que qualquer pergunta ou objeção já receba a resposta certa, sem fricção de uso.
    staticSys += `\nBASE DE CONHECIMENTO COMPLETA:\n`;
    Object.keys(KB).forEach((kb) => { if (kb !== "escalonamento") staticSys += `\n${KB[kb].trim()}\n`; });
    staticSys += `\nCite produtos e preços quando relevante. Se a KB não tiver a resposta, seja honesto. Se usar informação do bloco "REGRAS UNIVERSAIS DO SETOR (BENCHMARK)", deixe claro na resposta que é orientação geral do setor — não dado exclusivo/testado da Bruto — e recomende validar com a fábrica parceira em casos de dúvida real ou projeto fora do padrão. Se a situação do cliente se encaixar em algum dos casos de "QUANDO PARAR E CHAMAR O RESPONSÁVEL", diga isso claramente na resposta e recomende que a atendente escale antes de prometer qualquer coisa.`;
    staticSys += `\n\nANÁLISE DE FOTOS: quando o cliente enviar uma ou mais fotos da obra/reforma, observe antes de responder: estado da superfície (limpa, nivelada, com umidade, trincada), estágio da instalação (parede nua, assentamento em andamento, rejuntado, finalizado), produto provável (Brick, Cimentício ou Rockface — lembre que Rockface é só para uso externo) e se algo visível é defeito real ou variação artesanal esperada. Se vierem várias fotos juntas, compare entre elas (ex: ângulos diferentes do mesmo problema, ou antes/depois) antes de concluir. Responda direto à pergunta que vier com a(s) foto(s), no mesmo tom curto de WhatsApp. Se a imagem estiver escura, borrada ou de longe demais para concluir com segurança, diga isso e peça uma foto mais próxima em vez de adivinhar.`;

    staticSys += `\n\nCÓDIGO DE REFERÊNCIA (contexto de origem do lead): se a mensagem colada do cliente terminar com algo como "[ref:pagina_tipo_origem]" (ex: [ref:rosso-prime_produto-orcamento_google-ads]), isso é rastreio interno automático do site — NUNCA repita, mencione ou explique esse código pro cliente, só use pra calibrar sua resposta. Ele tem 3 partes separadas por "_": PAGINA (produto/página que a pessoa visitou — quase sempre o slug do produto, ex: "rosso-prime" = Brick Rosso Prime; já assuma que é esse o produto de interesse, sem precisar perguntar de novo), TIPO (qual botão específico foi clicado) e ORIGEM (de onde veio o tráfego). Ajuste a abordagem pelo TIPO: "produto-orcamento" → vá direto pra preço e condições; "produto-interesse" → seja mais consultivo, faça 1-2 perguntas antes de empurrar preço; "amostra-cta"/"amostra-header" → foque em como pedir/receber a amostra, não em fechar venda ainda; "consultor-cta"/"faq-consultor" → provavelmente tem uma dúvida técnica específica não resolvida pelo FAQ, pergunte qual é; "frete-gratis-popup" → cliente viu a promoção de frete grátis acima de 10m², confirme se a oferta se aplica. Se ORIGEM for "google-ads" ou outra origem paga, seja mais direto e objetivo, sem enrolação institucional — quem vem de anúncio já tem intenção mais definida.`;

    staticSys += `\n\nCLASSIFICAÇÃO DE TEMA (uso interno, não é visível pro cliente): ao final da sua resposta, em uma linha totalmente separada, inclua um marcador oculto no formato <!--tema:CATEGORIA--> onde CATEGORIA é exatamente UMA destas palavras: frete, instalacao, devolucao, qualidade, comparacao, preco, produto, manutencao, geral. Escolha a que melhor descreve o assunto CENTRAL da pergunta do cliente (não da resposta toda). "comparacao" é pra quando o cliente está decidindo entre produtos/linhas; "produto" é pra dúvida sobre um produto específico que não é preço nem comparação; "geral" só se nada mais se encaixar. Esse marcador nunca aparece pro cliente — é removido antes de exibir a resposta, existe só pra alimentar um contador interno de temas mais frequentes.`;

    // ── BLOCO DINÂMICO (não cacheado) ───────────────────────────────
    // Muda a cada turno/sessão — fica de fora do prefixo cacheado.
    let dynamicSys = `Modo: ${mode === "consulta" ? "CONSULTA TÉCNICA — seja direto e propositivo" : "DIAGNÓSTICO — investigue antes de concluir"}\n`;
    dynamicSys += `Cliente: ${client.name}${client.type ? ` (${client.type})` : ""}${client.project ? ` — ${client.project}` : ""}\n`;
    if (selectedKB.length > 0) {
      dynamicSys += `\nFOCO ADICIONAL solicitado pela atendente para esta pergunta: ${selectedKB.join(", ")}. Priorize esse assunto na resposta, mas use o restante da base se for relevante.\n`;
    }

    return [
      { type: "text", text: staticSys, cache_control: { type: "ephemeral" } },
      { type: "text", text: dynamicSys },
    ];
  }

  async function generateResponse(userMsg, history) {
    setBusy(true);
    try {
      // Janela deslizante: apenas os últimos 6 itens (3 turnos) para controlar tokens
      // Mensagens com foto anexada vão como bloco de imagem + texto (formato multimodal da API)
      // m.apiContent (quando presente) sobrepõe m.content só na chamada à API — usado por recursos
      // que mostram um texto curto no chat mas precisam enviar uma instrução mais detalhada ao Claude
      const windowedMsgs = history.slice(-6).map((m) => {
        const textForApi = m.apiContent || m.content;
        if (m.images && m.images.length > 0) {
          const blocks = m.images.map((img) => ({
            type: "image",
            source: { type: "base64", media_type: img.mediaType, data: img.dataUrl.split(",")[1] || "" },
          }));
          if (textForApi) blocks.push({ type: "text", text: textForApi });
          return { role: m.role, content: blocks };
        }
        return { role: m.role, content: textForApi };
      });

      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 600,
          system: buildSystemPrompt(),
          messages: windowedMsgs,
        }),
      });

      if (!response.ok) {
        const errBody = await response.text();

        if (response.status === 429) {
          let resetMsg = "";
          try {
            const parsed = JSON.parse(errBody);
            const innerMsg = parsed?.error?.message;
            const inner = typeof innerMsg === "string" ? JSON.parse(innerMsg) : innerMsg;
            if (inner?.resetsAt) {
              const resetDate = new Date(inner.resetsAt * 1000);
              const diffMin = Math.max(0, Math.round((resetDate - new Date()) / 60000));
              resetMsg = diffMin > 0
                ? `O limite renova em aproximadamente ${diffMin} minuto${diffMin === 1 ? "" : "s"} (≈ ${resetDate.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}).`
                : `O limite já deve ter renovado — tente enviar novamente.`;
            }
          } catch (_) { /* ignora erro de parse, usa mensagem genérica abaixo */ }

          throw new Error(
            `Limite de uso da IA atingido no momento.${resetMsg ? " " + resetMsg : " Aguarde alguns minutos e tente novamente."}`
          );
        }

        throw new Error(`HTTP ${response.status}: ${errBody.slice(0, 200)}`);
      }

      const data = await response.json();
      let text = data?.content?.find((c) => c.type === "text")?.text || "[Sem resposta da IA]";

      // Extrai a tag oculta de classificação de tema (uso interno, nunca exibida)
      const CATEGORIAS_TEMA = ["frete", "instalacao", "devolucao", "qualidade", "comparacao", "preco", "produto", "manutencao", "geral"];
      let tema = null;
      const matchTema = text.match(/<!--\s*tema:\s*([a-z]+)\s*-->/i);
      if (matchTema && CATEGORIAS_TEMA.includes(matchTema[1].toLowerCase())) {
        tema = matchTema[1].toLowerCase();
      }
      text = text.replace(/<!--\s*tema:\s*[a-z]+\s*-->/gi, "").trim();

      const lastUserHadImage = (history[history.length - 1]?.images?.length || 0) > 0;
      setMessages((prev) => [...prev, {
        role: "assistant",
        content: text,
        metadata: {
          mode,
          kb: selectedKB.join(", ") || (lastUserHadImage ? "análise de imagem" : "nenhuma"),
          generatedBy: "Claude (Sonnet 5)",
          tema,
        },
      }]);
    } catch (err) {
      setMessages((prev) => [...prev, {
        role: "assistant",
        content: `Não consegui gerar a resposta agora.\n\nErro: ${err.message}`,
        metadata: { mode: "error" },
      }]);
    } finally {
      setBusy(false);
    }
  }

  function currentDiagQuestion() {
    if (!diagFlow) return null;
    return DIAG_SCRIPTS[diagFlow.category].questions[diagFlow.stepIndex] || null;
  }

  function startDiag(category) {
    const script = DIAG_SCRIPTS[category];
    setMessages((prev) => [...prev, {
      role: "assistant",
      content: `${script.intro}\n\n${script.questions[0].text}`,
      metadata: { mode: "diagnostico", kb: category, generatedBy: "Motor de Diagnóstico (roteiro fixo)" },
    }]);
    setDiagFlow({ category, stepIndex: 0, answers: {} });
    setInput("");
  }

  function cancelDiag() {
    setMessages((prev) => [...prev, {
      role: "assistant",
      content: "Diagnóstico cancelado. Você pode iniciar outro a qualquer momento ou continuar conversando normalmente.",
      metadata: { mode: "diagnostico", kb: diagFlow?.category, generatedBy: "Motor de Diagnóstico (roteiro fixo)" },
    }]);
    setDiagFlow(null);
  }

  function answerDiag(value) {
    if (!diagFlow) return;
    const script = DIAG_SCRIPTS[diagFlow.category];
    const q = script.questions[diagFlow.stepIndex];
    const newAnswers = { ...diagFlow.answers, [q.id]: value };
    const nextIndex = diagFlow.stepIndex + 1;

    setMessages((prev) => [...prev, { role: "user", content: value }]);
    setInput("");

    if (nextIndex < script.questions.length) {
      const nextQ = script.questions[nextIndex];
      setMessages((prev) => [...prev, {
        role: "assistant",
        content: nextQ.text,
        metadata: { mode: "diagnostico", kb: diagFlow.category, generatedBy: "Motor de Diagnóstico (roteiro fixo)" },
      }]);
      setDiagFlow({ ...diagFlow, stepIndex: nextIndex, answers: newAnswers });
    } else {
      const result = script.diagnose(newAnswers);
      setMessages((prev) => [...prev, {
        role: "assistant",
        content: result,
        metadata: { mode: "diagnostico", kb: diagFlow.category, generatedBy: "Motor de Diagnóstico (regras Bruto, sem IA)" },
      }]);
      setDiagFlow(null);
    }
  }

  // ── B. RESUMO DE ATENDIMENTO PARA HANDOFF NO WHATSAPP ──────────────
  function buildHandoffSummary() {
    const lastUserMsgs = messages.filter((m) => m.role === "user").slice(-4).map((m) => `• ${m.content}`).join("\n");
    const lastAssistant = [...messages].reverse().find((m) => m.role === "assistant");
    let txt = `RESUMO DE ATENDIMENTO — BRUTO\n\n`;
    txt += `Cliente: ${client.name}\n`;
    if (client.phone) txt += `Telefone: ${client.phone}\n`;
    if (client.type) txt += `Tipo: ${client.type}\n`;
    if (client.project) txt += `Projeto: ${client.project}\n`;
    if (calcArea && !isNaN(parseFloat(calcArea))) {
      txt += `Área estimada: ${calcArea} m² (+${calcWaste}% perda técnica = ${(parseFloat(calcArea) * (1 + calcWaste / 100)).toFixed(2)} m² a comprar)\n`;
    }
    txt += `\nÚltimas perguntas do cliente:\n${lastUserMsgs || "(nenhuma registrada ainda)"}\n`;
    if (lastAssistant) txt += `\nÚltima resposta dada ao cliente:\n${lastAssistant.content}\n`;
    txt += `\n— Enviar ao consultor para confirmar valores, prazo e fechamento.`;
    return txt;
  }

  function openHandoffModal() {
    if (messages.length === 0) { alert("Ainda não há atendimento para resumir."); return; }
    setHandoffModal(buildHandoffSummary());
  }

    const greeting = name ? `Oi, ${name}! ` : "Oi! ";

  // ── D. MODO TREINO — GERA PERGUNTA DE CLIENTE + AVALIA A RESPOSTA DA ATENDENTE ──
  async function generateTrainingQuestion() {
    setBusy(true);
    setTrainingFeedback(null);
    setTrainingAnswer("");
    try {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 120,
          system: `Gere UMA única pergunta ou objeção realista que um cliente respondendo a uma campanha de marketing da Bruto Cerâmica (revestimentos artesanais Brick/Cimentício/Rockface) faria pelo chat. Varie entre dúvida técnica, objeção de preço, urgência ou indecisão entre produtos. Responda APENAS com a pergunta do cliente, sem aspas, sem explicação.`,
          messages: [{ role: "user", content: "Gere a pergunta de treino." }],
        }),
      });
      const data = await response.json();
      const text = (data.content || []).map((b) => b.text || "").join("").trim();
      if (text) setTrainingQuestion(text);
    } catch (e) {
      alert("Não foi possível gerar a pergunta de treino agora.");
    } finally {
      setBusy(false);
    }
  }

  async function submitTrainingAnswer() {
    const answer = trainingAnswer.trim();
    if (!answer || busy || !trainingQuestion) return;
    setBusy(true);
    setTrainingFeedback(null);
    try {
      // Reaproveita o mesmo bloco de sistema cacheado (tom + KB completa + escalonamento)
      // usado nas respostas normais, só acrescentando a instrução de avaliação por cima.
      const baseSystem = buildSystemPrompt();
      const evalInstruction = `MODO TREINO — AVALIAÇÃO INTERNA (não é uma resposta para o cliente). A pergunta simulada de cliente foi: "${trainingQuestion}". A atendente escreveu esta resposta de prática: "${answer}". Avalie usando a base de conhecimento acima: o que está correto, o que faltou ou saiu errado, se o tom bateu com o estilo Bruto (curto, direto, WhatsApp — até 80 palavras), e se era um caso que deveria ter sido escalado antes de responder. Dê uma nota de 0 a 10 e no máximo 3 linhas de feedback prático, falando diretamente com a atendente (não com o cliente).`;
      const systemForEval = Array.isArray(baseSystem)
        ? [...baseSystem, { type: "text", text: evalInstruction }]
        : `${baseSystem}\n\n${evalInstruction}`;

      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 300,
          system: systemForEval,
          messages: [{ role: "user", content: `Pergunta do cliente (simulada): ${trainingQuestion}\n\nResposta que a atendente escreveu: ${answer}` }],
        }),
      });
      if (!response.ok) {
        const errBody = await response.text();
        throw new Error(`HTTP ${response.status}: ${errBody.slice(0, 200)}`);
      }
      const data = await response.json();
      const text = data?.content?.find((c) => c.type === "text")?.text || "[Sem avaliação]";
      setTrainingFeedback(text);
    } catch (e) {
      setTrainingFeedback(`Não consegui avaliar agora. Erro: ${e.message}`);
    } finally {
      setBusy(false);
    }
  }

  function endTraining() {
    setTrainingQuestion(null);
    setTrainingAnswer("");
    setTrainingFeedback(null);
  }

  function send() {
    if (diagFlow && currentDiagQuestion()?.type === "text") {
      const text = input.trim();
      if (!text || busy) return;
      answerDiag(text);
      return;
    }
    const text = input.trim();
    const hasImages = imageAttachments.length > 0;
    if (!text && !hasImages) return;
    if (busy) return;
    const userMsg = {
      role: "user",
      content: text || (hasImages
        ? (imageAttachments.length > 1 ? "[Fotos da obra/reforma enviadas para análise]" : "[Foto da obra/reforma enviada para análise]")
        : ""),
      images: hasImages ? imageAttachments.map((img) => ({ dataUrl: img.dataUrl, mediaType: img.mediaType })) : null,
    };
    const newHistory = [...messages, userMsg];
    setMessages(newHistory);
    setInput("");
    setImageAttachments([]);
    setTimeout(() => generateResponse(userMsg, newHistory), 150);
  }

  function handleKeyDown(e) {

                      <div style={S.msgInfo}>
                        <div style={S.infoTitle}>Metadados da Resposta</div>
                        <div style={S.infoItem}><span style={S.infoLabel}>Modo:</span><span>{msg.metadata.mode || "—"}</span></div>
                        <div style={S.infoItem}><span style={S.infoLabel}>KB Usada:</span><span>{msg.metadata.kb || "—"}</span></div>
                        <div style={S.infoItem}><span style={S.infoLabel}>Gerada por:</span><span>{msg.metadata.generatedBy || "—"}</span></div>
                      </div>
                    )}
                  </div>
                );
              })}

              {busy && (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                  <div style={S.msgLabel(false)}>Gerando resposta...</div>
                  <div style={S.typingBubble}>
                    <span style={S.typingDot(0)}/><span style={S.typingDot(220)}/><span style={S.typingDot(440)}/>
                  </div>
                </div>
              )}
              <div ref={msgEndRef}/>
            </div>

            <div style={S.led}/>

            <div style={S.inputArea}>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/*"
                multiple
                style={{ display: "none" }}
                onChange={handleImageFileChange}
              />
              {trainingMode && !diagFlow && (
                <div style={S.trainingPanel}>
                  <div style={S.trainingPanelHeader}>
                    <span style={{ display: "flex", alignItems: "center", gap: 5 }}><GraduationCap size={12} strokeWidth={1.75}/> Modo Treino — pratique sem afetar o atendimento real</span>
                    <button style={S.trainingBtn} onClick={generateTrainingQuestion} disabled={busy}>
                      <Dices size={12} strokeWidth={1.75}/> {trainingQuestion ? "Nova pergunta" : "Gerar pergunta de cliente"}
                    </button>
                  </div>
                  {trainingQuestion && (
                    <>
                      <div style={S.trainingQuestionBox}><strong>Cliente (simulado):</strong> {trainingQuestion}</div>
                      <textarea
                        value={trainingAnswer}
                        onChange={(e) => setTrainingAnswer(e.target.value)}
                        placeholder="Escreva aqui a resposta que você daria para esse cliente..."
                        rows={2}
                        style={S.trainingAnswerInput}
                      />
                      <button style={S.trainingSubmitBtn} onClick={submitTrainingAnswer} disabled={!trainingAnswer.trim() || busy}>
                        Avaliar minha resposta
                      </button>
                    </>
                  )}
                  {trainingFeedback && (
                    <div style={S.trainingFeedbackBox}><strong>Feedback:</strong> {trainingFeedback}</div>
                  )}
                </div>
              )}
              {diagFlow && currentDiagQuestion()?.type === "options" ? (
                <div style={S.diagOptionsRow}>
                  {currentDiagQuestion().options.map((opt) => (
                    <button key={opt} style={S.diagOptionBtn} onClick={() => answerDiag(opt)} disabled={busy}>{opt}</button>
                  ))}
                  <button style={S.diagCancelBtn} onClick={cancelDiag} disabled={busy}>Cancelar diagnóstico</button>
                </div>
              ) : (
                <>
                  {imageAttachments.length > 0 && (
                    <div style={S.imagePreviewGrid}>
                      {imageAttachments.map((img, i) => (
                        <div key={i} style={S.imagePreviewRow}>
                          <img src={img.dataUrl} alt="Pré-visualização" style={S.imagePreviewThumb}/>
                          <span style={S.imagePreviewName}>{img.name}</span>
                          <button style={S.imagePreviewRemove} onClick={() => removeImageAttachment(i)} title="Remover imagem"><X size={12} strokeWidth={2}/></button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={S.inputRow}>
                    <button
                      style={S.attachBtn}
                      onClick={openImagePicker}
                      disabled={busy || imageAttachments.length >= MAX_IMAGES_PER_MSG}
                      title={imageAttachments.length >= MAX_IMAGES_PER_MSG ? `Máximo de ${MAX_IMAGES_PER_MSG} fotos por mensagem` : "Anexar foto(s) da obra/reforma do cliente"}
                    >
                      <Camera size={16} strokeWidth={1.75}/>
                    </button>
                    <textarea
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder={diagFlow ? "Digite sua resposta..." : (imageAttachments.length > 0 ? "Descreva a dúvida sobre a(s) foto(s) (opcional)..." : "Escreva a pergunta do cliente ou sua resposta...")}
                      rows={1}
                      style={S.msgInput}
                    />
                    <button style={S.sendBtn(sendActive)} disabled={!sendActive} onClick={send}><Send size={16} strokeWidth={1.75}/></button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>

        <div style={S.led}/>
        <footer style={S.footer}>
          <span>Bruto Cerâmica — Ferramenta de Atendimento Técnico</span>
          <span>✓ Claude (Sonnet 5) · {client.name !== "Cliente" ? client.name : "Cliente genérico"}</span>
        </footer>
      </div>

      {/* MODAL CLIENTE */}
      {clientModalOpen && (
        <div style={S.modalOverlay} onClick={() => setClientModalOpen(false)}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setClientModalOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Editar Perfil do Cliente</div>

            <div style={S.formGroup}>
              <label style={S.formLabel}>Nome</label>
              <input style={S.formInput} value={tmpClient.name} onChange={(e) => setTmpClient({ ...tmpClient, name: e.target.value })} placeholder="Ex: João Silva"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Telefone</label>
              <input style={S.formInput} value={tmpClient.phone || ""} onChange={(e) => setTmpClient({ ...tmpClient, phone: e.target.value })} placeholder="Ex: (11) 99999-9999"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Tipo de Cliente</label>
              <select style={S.formInput} value={tmpClient.type} onChange={(e) => setTmpClient({ ...tmpClient, type: e.target.value })}>
                <option value="">Selecionar...</option>
                <option value="arquiteto">Arquiteto/Designer</option>
                <option value="construtor">Construtor</option>
                <option value="revendedor">Revendedor</option>
                <option value="residencial">Residencial (DIY)</option>
                <option value="comercial">Comercial</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Projeto (opcional)</label>
              <input style={S.formInput} value={tmpClient.project} onChange={(e) => setTmpClient({ ...tmpClient, project: e.target.value })} placeholder="Ex: Casa moderna em São Paulo"/>
            </div>
            <button style={S.formButton} onClick={saveClient}>Salvar Perfil</button>
          </div>
        </div>
      )}

      {/* MODAL EDITAR PERFIL DE UMA CONVERSA DO HISTÓRICO (sem abrir a conversa) */}
      {editClientModal && (
        <div style={S.modalOverlay} onClick={() => { setEditClientModal(null); setEditClientFull(null); }}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => { setEditClientModal(null); setEditClientFull(null); }}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Editar Perfil do Cliente</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Ajusta só os dados do lead nessa conversa salva — não abre nem altera as mensagens.
            </p>

            <div style={S.formGroup}>
              <label style={S.formLabel}>Nome</label>
              <input style={S.formInput} value={editClientModal.name} onChange={(e) => setEditClientModal({ ...editClientModal, name: e.target.value })} placeholder="Ex: João Silva"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Telefone</label>
              <input style={S.formInput} value={editClientModal.phone || ""} onChange={(e) => setEditClientModal({ ...editClientModal, phone: e.target.value })} placeholder="Ex: (11) 99999-9999"/>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Tipo de Cliente</label>
              <select style={S.formInput} value={editClientModal.type} onChange={(e) => setEditClientModal({ ...editClientModal, type: e.target.value })}>
                <option value="">Selecionar...</option>
                <option value="arquiteto">Arquiteto/Designer</option>
                <option value="construtor">Construtor</option>
                <option value="revendedor">Revendedor</option>
                <option value="residencial">Residencial (DIY)</option>
                <option value="comercial">Comercial</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Projeto (opcional)</label>
              <input style={S.formInput} value={editClientModal.project} onChange={(e) => setEditClientModal({ ...editClientModal, project: e.target.value })} placeholder="Ex: Casa moderna em São Paulo"/>
            </div>
            {editClientErr && <div style={{ fontSize: 11, color: "#F09595", marginBottom: 10 }}>{editClientErr}</div>}
            <button style={{ ...S.formButton, opacity: editClientBusy ? 0.6 : 1 }} onClick={saveEditClient} disabled={editClientBusy}>
              {editClientBusy ? "Salvando..." : "Salvar Perfil"}
            </button>
          </div>
        </div>
      )}

      {/* MODAL EXPORTAR */}
      {exportModal && (
        <div style={S.modalOverlay} onClick={() => setExportModal(null)}>
          <div style={{ ...S.modalContent, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setExportModal(null)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>{exportModal.ext === "html" ? "Exportar Leitura" : "Exportar Histórico"}</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              {exportModal.ext === "html"
                ? <>O navegador bloqueou a aba nova. <strong style={{ color: white }}>Copie o HTML abaixo</strong>, cole num editor de texto e salve como <code style={{ color: teal }}>.html</code> — abra o arquivo depois pra ler formatado.</>
                : <>O download direto não é suportado neste ambiente. <strong style={{ color: white }}>Copie o JSON abaixo</strong>, cole num editor de texto e salve como <code style={{ color: teal }}>.json</code>.</>}
            </p>
            <textarea
              readOnly
              value={exportModal.content}
              onClick={(e) => e.target.select()}
              style={{ ...S.formInput, fontFamily: "monospace", fontSize: 10, height: 220, resize: "none", lineHeight: 1.5 }}
            />
            <ExportCopyBtn text={exportModal.content} label={exportModal.ext === "html" ? "Copiar HTML" : "Copiar JSON"}/>
          </div>
        </div>
      )}

      {/* MODAL RECOMENDADOR POR PROJETO */}
      {recommendModalOpen && (
        <div style={S.modalOverlay} onClick={() => setRecommendModalOpen(false)}>
          <div style={S.modalContent} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setRecommendModalOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Recomendar Linha para o Projeto</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Descreva o projeto com as palavras do cliente — a IA recomenda a linha e o produto certo, sem você precisar saber os nomes técnicos.
            </p>
            <div style={S.formGroup}>
              <label style={S.formLabel}>Descrição do projeto</label>
              <textarea
                value={recommendText}
                onChange={(e) => setRecommendText(e.target.value)}
                placeholder="Ex: fachada moderna com destaque na entrada, ou área gourmet rústica externa..."
                rows={4}
                style={{ ...S.formInput, resize: "none" }}
              />
            </div>
            <button style={S.formButton} onClick={submitRecommend} disabled={!recommendText.trim() || busy}>Gerar Recomendação</button>
          </div>
        </div>
      )}

      {/* MODAL TEMAS MAIS PERGUNTADOS */}
      {temasModalOpen && (
        <div style={S.modalOverlay} onClick={() => setTemasModalOpen(false)}>
          <div style={{ ...S.modalContent, maxWidth: 480 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setTemasModalOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Temas Mais Perguntados</div>
            {temasBusy && (
              <p style={{ fontSize: 12, color: mid2 }}>Lendo o histórico de atendimentos...</p>
            )}
            {!temasBusy && temasData?.erro && (
              <p style={{ fontSize: 12, color: "#E85D5D" }}>Não consegui carregar: {temasData.erro}</p>
            )}
            {!temasBusy && temasData && !temasData.erro && (
              <>
                <p style={{ fontSize: 11, color: mid2, marginBottom: 14, lineHeight: 1.6 }}>
                  {temasData.totalRespostas} respostas classificadas, de {temasData.sessoesAnalisadas} atendimento(s) no histórico
                  {temasData.semTema > 0 ? ` (${temasData.semTema} sem classificação — atendimentos antigos, de antes desse recurso)` : ""}.
                </p>
                {temasData.ranking.length === 0 ? (
                  <p style={{ fontSize: 12, color: mid2 }}>Nenhuma resposta classificada ainda. Esse contador só passa a acumular dados a partir de agora — os atendimentos anteriores não tinham essa marcação.</p>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {temasData.ranking.map((r, i) => (
                      <div key={r.tema} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{ fontFamily: syne, fontWeight: 700, fontSize: 11, color: mid2, width: 16 }}>{i + 1}</div>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3 }}>
                            <span style={{ color: white, fontWeight: 500 }}>{r.nome}</span>
                            <span style={{ color: mid2 }}>{r.n} · {r.pct.toFixed(0)}%</span>
                          </div>
                          <div style={{ height: 5, borderRadius: 3, background: card2, overflow: "hidden" }}>
                            <div style={{ height: "100%", width: `${r.pct}%`, background: teal, borderRadius: 3 }}/>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* MODAL RESUMO PARA WHATSAPP */}
      {handoffModal && (
        <div style={S.modalOverlay} onClick={() => setHandoffModal(null)}>
          <div style={{ ...S.modalContent, maxWidth: 560 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setHandoffModal(null)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Resumo do Atendimento</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Copie e cole no WhatsApp para o consultor dar continuidade sem perder contexto.
            </p>
            <textarea
              readOnly
              value={handoffModal}
              onClick={(e) => e.target.select()}
              style={{ ...S.formInput, fontFamily: "monospace", fontSize: 10.5, height: 220, resize: "none", lineHeight: 1.5 }}
            />
            <ExportCopyBtn text={handoffModal} label="Copiar Resumo"/>
          </div>
        </div>
      )}

      {/* MODAL GESTÃO DE USUÁRIOS (admin) */}
      {userMgmtOpen && (
        <div style={S.modalOverlay} onClick={() => setUserMgmtOpen(false)}>
          <div style={{ ...S.modalContent, maxWidth: 480 }} onClick={(e) => e.stopPropagation()}>
            <button style={S.modalClose} onClick={() => setUserMgmtOpen(false)}><X size={16} strokeWidth={1.75}/></button>
            <div style={S.modalTitle}>Gestão de Usuários</div>
            <p style={{ fontSize: 11, color: mid2, marginBottom: 12, lineHeight: 1.6 }}>
              Isso cadastra a pessoa <strong style={{ color: white }}>dentro da ferramenta</strong> (nome e papel). A senha de acesso é separada — crie/edite primeiro em
              {" "}<strong style={{ color: white }}>hPanel → Site → Avançado → Diretórios protegidos</strong>, usando o mesmo nome de usuário.
            </p>

            <div style={{ marginBottom: 16, paddingBottom: 14, borderBottom: `1px solid ${border}` }}>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Usuário (igual ao do Basic Auth)</label>
                <input style={S.formInput} value={newUserUsuario} onChange={(e) => setNewUserUsuario(e.target.value)} placeholder="ex: maria"/>
              </div>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Nome</label>
                <input style={S.formInput} value={newUserNome} onChange={(e) => setNewUserNome(e.target.value)} placeholder="ex: Maria Souza"/>
              </div>
              <div style={S.formGroup}>
                <label style={S.formLabel}>Papel</label>
                <select style={S.formInput} value={newUserPapel} onChange={(e) => setNewUserPapel(e.target.value)}>
                  <option value="atendente">Atendente</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              {userMgmtErr && <div style={{ fontSize: 11, color: "#F09595", marginBottom: 10 }}>{userMgmtErr}</div>}
              <button style={{ ...S.formButton, opacity: (userMgmtBusy || !newUserUsuario.trim() || !newUserNome.trim()) ? 0.6 : 1 }} onClick={submitNewUser} disabled={userMgmtBusy || !newUserUsuario.trim() || !newUserNome.trim()}>
                Cadastrar usuário
              </button>
            </div>

            <div style={S.formLabel}>Equipe atual</div>
            <div style={{ maxHeight: 240, overflowY: "auto", marginTop: 8 }}>
              {userMgmtList.length === 0 && <div style={{ fontSize: 11, color: mid2 }}>Nenhum usuário cadastrado ainda.</div>}
              {userMgmtList.map((u) => (
                <div key={u.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid rgba(46,46,46,.5)` }}>
                  <div>
                    <div style={{ fontSize: 12, color: white, fontWeight: 600 }}>{u.nome} {u.papel === "admin" ? "★" : ""}</div>
                    <div style={{ fontSize: 10, color: mid2 }}>{u.usuario} · {u.ativo ? "ativo" : "desativado"}</div>
                  </div>
                  <button
                    style={{ ...S.histActionBtn, opacity: userMgmtBusy ? 0.5 : 1 }}
                    disabled={userMgmtBusy}
                    onClick={() => toggleUserActive(u.id, !u.ativo)}
                  >
                    {u.ativo ? "Desativar" : "Reativar"}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ESTILOS ──────────────────────────────────────────────────────────
const teal = "#57999B";
const bg = "#0F0F0F";
const surface = "#1A1A1A";
const card = "#242424";
const card2 = "#2A2A2A";
const border = "#2E2E2E";
const white = "#F2F2F2";
const mid = "#606060";
const mid2 = "#888888";
const syne = "'Syne', sans-serif";
const barlow = "'Barlow Condensed', sans-serif";
const dm = "'DM Sans', sans-serif";
const green = "#4ADE80";
const amber = "#FBBF24";

  header: { display: "flex", alignItems: "center", gap: 12, padding: "12px 20px", background: `linear-gradient(180deg,#181818 0%,${surface} 100%)`, borderBottom: `1px solid ${border}`, flexShrink: 0 },
  logoLockup: { display: "flex", alignItems: "center", gap: 7 },
  lockupDivider: { width: 1, height: 20, background: "#2A2A2A", marginRight: 2 },
  logoMark: { fontFamily: barlow, fontWeight: 600, fontSize: 22, letterSpacing: ".10em", textTransform: "uppercase", color: white },
  logoDash: { width: 18, height: 1.5, background: teal },
  logoCo: { fontFamily: barlow, fontWeight: 400, fontSize: 11, letterSpacing: ".20em", textTransform: "uppercase", color: teal },
  headerRight: { display: "flex", gap: 12, alignItems: "center", marginLeft: "auto" },

  statusBadge: { display: "flex", alignItems: "center", gap: 6, padding: "5px 12px", borderRadius: 20, background: "rgba(74,222,128,.08)", border: "1px solid rgba(74,222,128,.25)", color: green, fontSize: 10, fontWeight: 500 },
  dot: { width: 5, height: 5, borderRadius: "50%", background: green },
  bodyWrap: { display: "flex", flex: 1, overflow: "hidden" },
  aside: { width: 220, minWidth: 220, borderRight: `1px solid ${border}`, background: `linear-gradient(180deg,${card} 0%,#0a0a0a 100%)`, display: "flex", flexDirection: "column", overflowY: "auto" },
  sidebarSection: { padding: "12px 13px", borderBottom: `1px solid ${border}` },
  sectionTitle: { fontSize: 8.5, fontWeight: 600, textTransform: "uppercase", letterSpacing: ".16em", color: teal, marginBottom: 8 },
  clientCard: { background: "rgba(87,153,155,.06)", border: "1px solid rgba(87,153,155,.15)", borderRadius: 6, padding: 10 },
  clientName: { fontFamily: syne, fontWeight: 700, fontSize: 12, color: white, marginBottom: 3 },
  clientDetail: { fontSize: 9, color: mid, lineHeight: 1.4 },
  editBtn: { marginTop: 8, width: "100%", padding: 6, border: "1px solid rgba(87,153,155,.3)", background: "transparent", borderRadius: 4, color: teal, fontSize: 9, cursor: "pointer", fontFamily: dm },
  kbGroupLabel: { fontSize: 8, color: mid2, marginBottom: 6, textTransform: "uppercase", letterSpacing: ".08em" },
  kbItem: (active) => ({
    padding: "6px 8px", fontSize: 10, color: active ? teal : mid2,
    background: active ? "rgba(87,153,155,.1)" : "transparent",
    border: `1px solid ${active ? "rgba(87,153,155,.3)" : "transparent"}`,
    borderRadius: 4, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, marginBottom: 2,
  }),
  tipBox: { padding: "12px 13px", marginTop: "auto", background: "rgba(87,153,155,.04)", borderTop: `1px solid rgba(87,153,155,.15)` },
  chatArea: { flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" },
  toolbar: { padding: "10px 16px", background: "linear-gradient(90deg,rgba(87,153,155,.05),rgba(87,153,155,.02))", borderBottom: "1px solid rgba(87,153,155,.1)", display: "flex", alignItems: "center", gap: 8, flexShrink: 0, flexWrap: "wrap", minHeight: 18 },
  toolItem: (active) => ({
    display: "flex", alignItems: "center", gap: 4, padding: "4px 10px", borderRadius: 6,
    border: `1px solid ${active ? teal : "rgba(87,153,155,.2)"}`, background: active ? "rgba(87,153,155,.15)" : "transparent",
    cursor: "pointer", color: active ? teal : mid2, fontSize: 9,
  }),
  messages: { flex: 1, overflowY: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 4 },
  emptyState: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flex: 1, gap: 12, color: mid2, height: "100%" },
  emptyIcon: { fontSize: 48, opacity: 0.4 },
