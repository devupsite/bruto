<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UP·Lead — CRM & Vendas</title>
  <meta name="author" content="Rafael Barros — UP Co."/>
  <script src="config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="nav.js"></script>
  <style>
    .lead-body { flex:1;display:flex;flex-direction:column;overflow:hidden; }
    .lead-tabs { display:flex;align-items:center;border-bottom:1px solid var(--border);padding:0 28px;margin-top:16px;flex-shrink:0; }
    .lead-tab { padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:6px;user-select:none; }
    .lead-tab:hover { color:var(--text); }
    .lead-tab.active { color:var(--text);border-bottom-color:var(--teal); }
    .tab-count { font-size:10px;font-weight:500;background:var(--bg3);color:var(--muted);padding:1px 6px;border-radius:10px; }
    .lead-tab.active .tab-count { background:var(--teal-12);color:var(--teal); }
    .lead-panels { flex:1;overflow:hidden; }
    .lead-panel { display:none;height:100%; }
    .lead-panel.active { display:flex; }

    /* Conversas */
    .conv-list { width:280px;min-width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden; }
    .conv-search { padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0; }
    .conv-search-wrap { position:relative; }
    .conv-search-wrap svg { position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none; }
    .conv-search-input { background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px 6px 32px;font-size:13px;color:var(--text);width:100%; }
    .conv-search-input:focus { border-color:var(--teal);outline:none; }
    .conv-search-input::placeholder { color:var(--dim); }
    .conv-filters { display:flex;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0; }
    .conv-filter { font-size:11px;font-weight:500;padding:4px 10px;color:var(--muted);cursor:pointer;border-radius:4px;transition:all .15s; }
    .conv-filter:hover { color:var(--text); }
    .conv-filter.active { background:var(--teal-12);color:var(--teal); }
    .conv-items { flex:1;overflow-y:auto; }
    .conv-item { padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s; }
    .conv-item:hover { background:rgba(255,255,255,.02); }
    .conv-item.active { background:var(--teal-12); }
    .conv-item-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:4px; }
    .conv-item-name { font-size:13px;font-weight:500;color:var(--text); }
    .conv-item-time { font-size:11px;color:var(--dim); }
    .conv-item-preview { font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px; }
    .conv-item-meta { display:flex;align-items:center;gap:6px; }

    .conv-chat { flex:1;display:flex;flex-direction:column;overflow:hidden; }
    .conv-chat-header { padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
    .conv-chat-name { font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.02em; }
    .conv-messages { flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px; }
    .msg { max-width:72%;display:flex;flex-direction:column;gap:2px; }
    .msg.inbound { align-self:flex-start; }
    .msg.outbound { align-self:flex-end; }
    .msg-bubble { padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5; }
    .msg.inbound .msg-bubble { background:var(--bg3);color:var(--text);border-bottom-left-radius:3px; }
    .msg.outbound .msg-bubble { background:var(--teal-22);color:var(--text);border-bottom-right-radius:3px; }
    .msg-time { font-size:10px;color:var(--dim);padding:0 4px; }
    .msg.outbound .msg-time { align-self:flex-end; }
    .conv-input-area { padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0; }
    .conv-input-row { display:flex;gap:8px;align-items:flex-end; }
    .conv-textarea { flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);resize:none;min-height:38px;max-height:120px;line-height:1.5;transition:border-color .15s;font-family:'Barlow',sans-serif; }
    .conv-textarea:focus { border-color:var(--teal);outline:none; }
    .conv-textarea::placeholder { color:var(--dim); }
    .btn-send { background:var(--teal);color:#fff;border:none;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s;flex-shrink:0; }
    .btn-send:hover { opacity:.85; }
    .conv-actions-row { display:flex;align-items:center;gap:8px;margin-top:8px; }

    .conv-contact-panel { width:256px;min-width:256px;border-left:1px solid var(--border);overflow-y:auto;padding:16px; }
    .contact-panel-title { font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:12px; }
    .contact-score-bar { height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:6px 0 12px; }
    .contact-score-fill { height:100%;background:var(--teal);border-radius:2px;transition:width .6s ease; }
    .contact-field { margin-bottom:12px; }
    .contact-field-label { font-size:11px;color:var(--dim);margin-bottom:3px; }
    .contact-field-value { font-size:13px;color:var(--text); }
    .ai-box { background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:12px; }
    .ai-box-label { font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:8px;display:flex;align-items:center;gap:5px; }
    .ai-box-text { font-size:12px;color:var(--muted);line-height:1.6; }

    /* Contatos */
    .contacts-panel { flex:1;flex-direction:column;overflow:hidden; }
    .contacts-toolbar { padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border); }
    .contacts-table-wrap { flex:1;overflow-y:auto;padding:0 24px 24px; }
    table.leads-table { width:100%;border-collapse:collapse;margin-top:8px; }
    .leads-table th { text-align:left;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 12px;border-bottom:1px solid var(--border); }
    .leads-table td { padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:var(--text); }
    .leads-table tr:hover td { background:rgba(255,255,255,.02); }
    .priority-dots { display:flex;gap:3px; }
    .priority-dot { width:6px;height:6px;border-radius:50%;background:var(--border); }
    .priority-dot.filled { background:var(--teal); }

    /* Pipeline */
    .pipeline-panel { flex:1;flex-direction:column;overflow:hidden; }
    .pipeline-toolbar { padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border); }
    .pipeline-board { flex:1;display:flex;gap:12px;padding:16px 24px;overflow-x:auto;overflow-y:hidden; }
    .pipeline-col { min-width:210px;width:210px;display:flex;flex-direction:column;gap:8px; }
    .pipeline-col-header { display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:4px; }
    .pipeline-col-desc { font-size:10px;color:var(--dim);line-height:1.4;padding:0 4px;margin-bottom:8px;min-height:26px; }
    .pipeline-col-title { font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px; }
    .pipeline-col-dot { width:6px;height:6px;border-radius:50%; }
    .pipeline-col-count { font-size:11px;color:var(--dim); }
    .pipeline-card { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:grab;transition:border-color .15s,transform .1s; }
    .pipeline-card:hover { border-color:var(--teal);transform:translateY(-1px); }
    .pipeline-card.dragging { opacity:.5;cursor:grabbing; }
    .pipeline-col.drag-over { background:var(--teal-12);border-radius:8px; }
    .pipeline-card-name { font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px; }
    .pipeline-card-company { font-size:12px;color:var(--muted);margin-bottom:8px; }
    .pipeline-card-footer { display:flex;align-items:center;justify-content:space-between; }
    .pipeline-card-value { font-size:13px;font-weight:500;color:var(--teal);font-family:'Barlow Condensed',sans-serif; }

    /* Modal */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px); }
    .modal-overlay.hidden { display:none; }
    .modal { background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:440px;max-width:90vw; }
    .modal-title { font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;margin-bottom:20px;color:var(--text); }
    .form-group { margin-bottom:14px; }
    .form-label { display:block;font-size:12px;color:var(--muted);margin-bottom:5px; }
    .form-actions { display:flex;gap:8px;justify-content:flex-end;margin-top:20px; }
    .empty-state { display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--dim); }
    .empty-state p { font-size:13px; }
  </style>
</head>
<body>
<div class="suite-layout">
  <aside id="suite-sidebar" class="suite-sidebar"></aside>
  <main class="suite-main">
    <div class="module-header">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div>
          <h1 class="module-title">UP <span class="dash">—</span> Lead</h1>
          <p class="module-subtitle">CRM & vendas · pipeline comercial</p>
        </div>
        <button class="btn btn-primary" onclick="openNewLeadModal()" style="margin-top:4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo lead
        </button>
      </div>
    </div>

    <div class="lead-tabs">
      <div class="lead-tab active" onclick="switchTab('conversas',this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Conversas <span class="tab-count" id="count-conversas">3</span>
      </div>
      <div class="lead-tab" onclick="switchTab('contatos',this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Contatos <span class="tab-count" id="count-contatos">3</span>
      </div>
      <div class="lead-tab" onclick="switchTab('pipeline',this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="5" height="18"/><rect x="10" y="8" width="5" height="13"/><rect x="17" y="5" width="5" height="16"/></svg>
        Pipeline <span class="tab-count" id="count-pipeline">—</span>
      </div>
    </div>

    <div class="lead-panels">

      <!-- CONVERSAS -->
      <div id="panel-conversas" class="lead-panel active">
        <div class="conv-list">
          <div class="conv-search">
            <div class="conv-search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="conv-search-input" type="text" placeholder="Buscar conversa…" oninput="filterConversas(this.value)"/>
            </div>
          </div>
          <div class="conv-filters">
            <div class="conv-filter active" onclick="filterStatus('all',this)">Todas</div>
            <div class="conv-filter" onclick="filterStatus('open',this)">Abertas</div>
            <div class="conv-filter" onclick="filterStatus('pending',this)">Pendentes</div>
          </div>
          <div class="conv-items" id="conv-items-list"></div>
        </div>

        <div class="conv-chat">
          <div class="conv-chat-header">
            <div>
              <div class="conv-chat-name" id="conv-chat-name">Selecione uma conversa</div>
              <div style="font-size:12px;color:var(--muted)" id="conv-chat-sub"></div>
            </div>
            <div style="display:flex;gap:8px;" id="conv-header-actions"></div>
          </div>
          <div class="conv-messages" id="conv-messages">
            <div class="empty-state">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--dim)"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <p>Selecione uma conversa</p>
            </div>
          </div>
          <div class="conv-input-area" id="conv-input-area" style="display:none;">
            <div class="conv-input-row">
              <textarea class="conv-textarea" id="conv-textarea" placeholder="Digite sua mensagem…" rows="1" onkeydown="handleTextareaKey(event)" oninput="autoResizeTextarea(this)"></textarea>
              <button class="btn-send" onclick="sendMessage()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
            <div class="conv-actions-row">
              <button class="btn btn-ghost btn-sm" id="btn-suggest" onclick="suggestResponse()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Sugerir resposta
              </button>
              <button class="btn btn-ghost btn-sm" onclick="markResolved()">Resolver</button>
            </div>
          </div>
        </div>

        <div class="conv-contact-panel">
          <div class="contact-panel-title">Contato</div>
          <div id="contact-panel-content">
            <div class="empty-state" style="height:auto;padding-top:40px;"><p style="color:var(--dim);">Selecione uma conversa</p></div>
          </div>
        </div>
      </div>

      <!-- CONTATOS -->
      <div id="panel-contatos" class="lead-panel">
        <div class="contacts-panel">
          <div class="contacts-toolbar">
            <div style="position:relative;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="input" style="padding-left:32px;width:240px;" type="text" placeholder="Buscar contato…" oninput="filterContatos(this.value)"/>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <select class="input" style="width:auto;padding:7px 12px;" onchange="filterTemperatura(this.value)">
                <option value="">Todas temperaturas</option>
                <option value="quente">Quente</option>
                <option value="morno">Morno</option>
                <option value="frio">Frio</option>
              </select>
              <button class="btn btn-primary btn-sm" onclick="openNewLeadModal()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Novo lead
              </button>
            </div>
          </div>
          <div class="contacts-table-wrap">
            <table class="leads-table">
              <thead>
                <tr>
                  <th>Nome</th><th>Tipo</th><th>Temperatura</th>
                  <th>Prioridade</th><th>Próximo passo</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody id="contatos-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PIPELINE -->
      <div id="panel-pipeline" class="lead-panel">
        <div class="pipeline-panel">
          <div class="pipeline-toolbar">
            <div style="font-size:13px;color:var(--muted);">
              <span id="pipeline-total-value" style="color:var(--text);font-weight:600;font-family:'Barlow Condensed',sans-serif;"></span>
              <span> em pipeline</span>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openNewDealModal()">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Novo deal
            </button>
          </div>
          <div class="pipeline-board" id="pipeline-board"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal Novo Lead -->
<div class="modal-overlay hidden" id="modal-new-lead" onclick="closeModalOnBackdrop(event,'modal-new-lead')">
  <div class="modal">
    <div class="modal-title">Novo lead</div>
    <div class="form-group"><label class="form-label">Nome</label><input class="input" id="new-lead-nome" type="text" placeholder="Nome do contato"/></div>
    <div class="form-group">
      <label class="form-label">Canal de entrada</label>
      <select class="input" id="new-lead-canal">
        <option>WhatsApp</option><option>Instagram DM</option><option>Formulário</option><option>Indicação</option><option>LinkedIn</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Mensagem inicial</label><textarea class="input" id="new-lead-mensagem" rows="3" placeholder="O que o lead disse…" style="resize:vertical;"></textarea></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-new-lead')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveLead()">Classificar com IA →</button>
    </div>
  </div>
</div>

<!-- Modal Novo Deal -->
<div class="modal-overlay hidden" id="modal-new-deal" onclick="closeModalOnBackdrop(event,'modal-new-deal')">
  <div class="modal">
    <div class="modal-title">Novo deal</div>
    <div class="form-group"><label class="form-label">Título</label><input class="input" id="new-deal-titulo" type="text" placeholder="Ex: Rockface Urban — Fachada Comercial"/></div>
    <div class="form-group"><label class="form-label">Contato</label><select class="input" id="new-deal-lead"></select></div>
    <div class="form-group">
      <label class="form-label">Etapa</label>
      <select class="input" id="new-deal-stage">
        <option value="contato">Contato</option><option value="qualificado">Qualificado</option><option value="amostra">Amostra enviada</option><option value="orcamento">Orçamento</option><option value="fechamento">Fechamento</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Valor estimado (R$)</label><input class="input" id="new-deal-valor" type="number" placeholder="12400"/></div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-new-deal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveDeal()">Criar deal</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
// ── MOCK DATA (com persistência local) ─────────────────────
// Na primeira vez, usa os dados de demonstração abaixo.
// A partir daí, lê/escreve do localStorage — sobrevive a refresh.
// NOTA DE PRODUÇÃO: em produção real, este painel não deve manter um cadastro
// de leads paralelo — ele lê a mesma tabela `sessoes_atendimento` (MySQL) que
// já alimenta o Atendimento Técnico, e adiciona por cima os campos que faltam
// pra virar pipeline: etapa, valor estimado e "dias desde a última interação".
// Em DEMO_MODE segue com dados de exemplo pra validar layout e fluxo antes
// da ponte PHP ser construída.
const DEMO_LEADS = [
    { id:'l1', nome:'Camila Duarte', tipo:'arquiteto', canal:'WhatsApp', ultima_interacao:'2026-07-25', mensagem_original:'Olá! Vi o Rockface Urban no Instagram, preciso pra uma fachada comercial.', temperatura:'quente', prioridade:5, status:'open', proximo_passo:'Confirmar prazo de produção com a fábrica e responder hoje', ai_intencao:'Arquiteta com projeto de fachada em andamento, ~140m². Já tem referência visual definida.', ai_qualificacao:'Perfil ICP forte — arquiteta com projeto ativo, decide junto com o cliente final.', lead_score:91, sentimento:'positive', criado_em:'2026-07-22',
      historico:[
        {dir:'inbound', text:'Olá! Vi o Rockface Urban no Instagram, preciso pra uma fachada comercial.', time:'10:02'},
        {dir:'outbound',text:'Oi Camila! Legal — me conta um pouco do projeto: metragem aproximada e se é fachada nova ou reforma?', time:'10:15'},
        {dir:'inbound', text:'É uma fachada nova, comercial, uns 140m². Preciso do orçamento pra fechar com o cliente essa semana.', time:'10:20'},
      ]},
    { id:'l2', nome:'Estúdio Verbo Arquitetura', tipo:'arquiteto', canal:'Instagram DM', ultima_interacao:'2026-07-18', mensagem_original:'Boa tarde, gostaríamos de amostras da linha Brick para um residencial.', temperatura:'morno', prioridade:3, status:'pending', proximo_passo:'Fazer follow-up das amostras enviadas há 10 dias', ai_intencao:'Escritório especificando Brick pra um residencial de alto padrão. Já recebeu amostras físicas.', ai_qualificacao:'Perfil ICP — escritório de arquitetura, decisão em equipe com o cliente final.', lead_score:58, sentimento:'neutral', criado_em:'2026-07-15',

// MOCK carrega do localStorage se existir; senão, usa dados de demonstração.
// A partir daqui, toda alteração (addLead, addDeal, moveDeal) grava de volta no localStorage.
const MOCK = {
  leads:    window.localPersist.load('leads', DEMO_LEADS),
  pipeline: window.localPersist.load('pipeline', DEMO_PIPELINE),
};

function persistLeads()    { window.localPersist.save('leads', MOCK.leads); }
function persistPipeline() { window.localPersist.save('pipeline', MOCK.pipeline); }

// ── Leads manuais (não vêm de sessão real do Atendimento) ──────
// Mesmo padrão do UP·Flow: ficam só no localStorage, nunca escritos
// em sessoes_atendimento nem confundidos com dado real na tela.
function _manualLeadsCarregar() { return window.localPersist.load('leads_manuais', []); }
function _manualLeadsSalvar(lista) { window.localPersist.save('leads_manuais', lista); }

// ── DATA LAYER ───────────────────────────────────────────────
const DATA_LAYER = window.createDataLayer(
  {
    getLeads:    ()      => Promise.resolve([...MOCK.leads]),
    getLead:     (id)    => Promise.resolve(MOCK.leads.find(l => l.id === id)),
    addLead:     (lead)  => { MOCK.leads.unshift(lead); persistLeads(); return Promise.resolve(lead); },
    getPipeline: ()      => Promise.resolve(JSON.parse(JSON.stringify(MOCK.pipeline))),
    addDeal:     (deal)  => {
      const s = MOCK.pipeline.find(s => s.id === deal.stage_id);
      if (s) s.deals.push(deal);
      persistPipeline();
      return Promise.resolve(deal);
    },
    moveDeal: (dealId, toStageId) => {
      let deal;
      MOCK.pipeline.forEach(s => { const i = s.deals.findIndex(d => d.id === dealId); if (i > -1) deal = s.deals.splice(i,1)[0]; });
      const t = MOCK.pipeline.find(s => s.id === toStageId);
      if (deal && t) t.deals.push(deal);
      persistPipeline();
      return Promise.resolve();
    }
  },
  {
    // Leads reais: join sessoes_atendimento + lead_pipeline, via
    // api/leads.php → bruto-secrets/API/suite-leads.php. Nunca escreve
    // em sessoes_atendimento — só em lead_pipeline.
    getLeads: async () => {
      const res = await fetch('api/leads.php', { method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ acao:'listar' }) });
      if (res.status === 401) { window.location.replace('login.html?m=sessao'); return []; }
      const data = await res.json().catch(() => ({ leads: [] }));
      if (!res.ok) { window.toast?.(data.erro || 'Não consegui carregar os leads.', 'error'); return _manualLeadsCarregar(); }
      return [...(data.leads || []), ..._manualLeadsCarregar()];
    },
    getLead: async (id) => (await DATA_LAYER.getLeads()).find(l => l.id === id),
    // "Novo lead" manual — não corresponde a uma sessão real do Atendimento,
    // fica só no localStorage, igual o UP·Flow trata "projeto interno".
    addLead: (lead) => {
      const lista = _manualLeadsCarregar();
      lista.unshift({ ...lead, origem:'manual' });
      _manualLeadsSalvar(lista);
      return Promise.resolve(lead);
    },
    // Pipeline é derivado da MESMA lista de leads, agrupada por etapa —
    // não é mais uma coleção separada. Cada card = 1 lead real (ou manual).
    getPipeline: async () => {
      const leads = await DATA_LAYER.getLeads();
      const funil = window.BRUTO_OPS?.funil || [];
      return funil.map(et => ({
        id: et.id, nome: et.nome, cor: et.cor, desc: et.desc,
        deals: leads.filter(l => (l.etapa || 'contato') === et.id).map(l => ({
          id: l.id, titulo: l.nome + (l.linha ? ' — ' + l.linha : ''), lead: l.nome,
          valor: l.valor_estimado || 0, label: l.proximo_passo, origem: l.origem,
        })),
      }));
    },
    // "Criar deal" vinculado a um lead existente = atualizar etapa/valor
    // desse lead. Sem lead vinculado = cria um lead manual novo.
    addDeal: async (deal) => {
      if (!deal.leadId) {
        return DATA_LAYER.addLead({
          id: deal.id, nome: deal.lead, etapa: deal.stage_id, valor_estimado: deal.valor,
          proximo_passo: deal.label, tipo: null, canal: 'Manual', temperatura: 'frio',
          prioridade: 2, lead_score: 20, status: 'open', criado_em: new Date().toISOString().slice(0,10),
          historico: [],
        });
      }
      const leads = await DATA_LAYER.getLeads();
      const alvo = leads.find(l => l.id === deal.leadId);
      if (alvo?.origem === 'manual') {
        const lista = _manualLeadsCarregar();
        const item = lista.find(l => l.id === deal.leadId);
        if (item) { item.etapa = deal.stage_id; item.valor_estimado = deal.valor; }
        _manualLeadsSalvar(lista);
        return;
      }
      await fetch('api/leads.php', { method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'salvar_pipeline', sessao_id: deal.leadId, etapa: deal.stage_id, valor_estimado: deal.valor }) });
    },
    // Arrastar card entre colunas do kanban
    moveDeal: async (dealId, toStageId) => {
      const leads = await DATA_LAYER.getLeads();
      const alvo = leads.find(l => l.id === dealId);
      if (alvo?.origem === 'manual') {
        const lista = _manualLeadsCarregar();
        const item = lista.find(l => l.id === dealId);
        if (item) { item.etapa = toStageId; _manualLeadsSalvar(lista); }
        return;
      }
      await fetch('api/leads.php', { method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'mover_etapa', sessao_id: dealId, etapa: toStageId }) });
    },
  }
);

// Lê o .txt selecionado (client-side, sem passar pelo servidor) e joga

function lerArquivoFollowup(leadId) {
  const input = document.getElementById('followup-file-' + leadId);
  const arquivo = input.files?.[0];
  if (!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = () => {

  leitor.onerror = () => toast('Não consegui ler esse arquivo.', 'error');
  leitor.readAsText(arquivo, 'UTF-8');
}

// Parser do formato de exportação do WhatsApp (Android "hífen" e iOS
// "colchetes"). Mensagem que não bate o formato vira continuação da
// anterior (multi-linha) — se NADA bater (texto colado não é um export
// de verdade), cai no fallback: mostra o texto inteiro como uma
// mensagem só, em vez de simplesmente sumir com o que foi colado.
function parseWhatsApp(texto, nomeCliente) {
  const linhas = String(texto || '').split('\n');
  const regex = /^\[?(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*-?\s*([^:]{1,60}):\s(.*)$/;
  const brutos = [];
  for (const linhaRaw of linhas) {
    const linha = linhaRaw.trim();
    if (!linha) continue;
    const m = linha.match(regex);
    if (m) brutos.push({ hora: m[2].slice(0,5), remetente: m[3].trim(), texto: m[4] });
    else if (brutos.length > 0) brutos[brutos.length - 1].texto += '\n' + linha;
  }
  if (brutos.length === 0) {
    return texto?.trim() ? [{ dir: 'inbound', text: texto.trim(), time: '' }] : [];
  }
  const nomeNormalizado = (nomeCliente || '').toLowerCase();
  return brutos.map(m => ({
    dir: nomeNormalizado && m.remetente.toLowerCase().includes(nomeNormalizado) ? 'inbound' : 'outbound',
    text: m.texto,
    time: m.hora,
  }));
}

    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ acao:'salvar_anexo', sessao_id: leadId, texto }) });

  state.leads = await DATA_LAYER.getLeads();
  const l = state.leads.find(x => x.id === leadId);

}

  const text = ta.value.trim();
  if (!text || !state.activeConvId) return;
  const l = state.leads.find(x => x.id === state.activeConvId);
  if (!l) return;
  const time = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  l.historico.push({dir:'outbound', text, time});
  persistLeads();
  const msgs = document.getElementById('conv-messages');
  const el = document.createElement('div');
  el.className = 'msg outbound';
  el.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-time">${time}</div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  ta.value = ''; ta.style.height = 'auto';
  renderConversas();
}

function markResolved() {
  if (!state.activeConvId) return;
  const l = state.leads.find(x => x.id === state.activeConvId);
  if (l) { l.status = 'resolved'; persistLeads(); renderConversas(); toast(`${l.nome} marcado como resolvido`, 'success'); }
}

function handleTextareaKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResizeTextarea(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// ── CONTATOS ─────────────────────────────────────────────────
function diasParado(l) {
  // Leads reais já vêm com isso calculado no servidor (suite-leads.php).
  if (l.dias_sem_contato !== undefined) return l.dias_sem_contato;
  if (!l.ultima_interacao) return null;
  const d = Math.floor((Date.now() - new Date(l.ultima_interacao).getTime()) / 86400000);
  return isNaN(d) ? null : d;
}

function renderContatos() {
  let leads = state.leads;
  if (state.contFilter) leads = leads.filter(l => l.nome.toLowerCase().includes(state.contFilter.toLowerCase()));
  if (state.contTempFilter) leads = leads.filter(l => l.temperatura === state.contTempFilter);
  const tipos = window.BRUTO_OPS?.tipos_cliente || [];
  document.getElementById('contatos-tbody').innerHTML = leads.map(l => {
    const t = tipos.find(x => x.id === l.tipo);
    const dias = diasParado(l);
    const sla = window.BRUTO_OPS?.slas?.amostra_followup_dias || 7;
    const alerta = dias !== null && dias >= sla;
    return `
    <tr>
      <td><span style="font-weight:500;">${l.nome}</span></td>
      <td><span style="color:var(--muted);">${t ? t.nome : (l.canal||'—')}</span></td>
      <td><span class="badge badge-${l.temperatura}">${l.temperatura}</span></td>
      <td><div class="priority-dots">${Array.from({length:5},(_,i)=>`<div class="priority-dot ${i<l.prioridade?'filled':''}"></div>`).join('')}</div></td>
      <td style="color:var(--muted);max-width:200px;font-size:12px;">${l.proximo_passo}</td>
      <td style="color:${alerta?'var(--amber)':'var(--dim)'};font-size:12px;">${dias !== null ? `${dias}d sem contato` : l.criado_em}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="selectConv('${l.id}');switchTab('conversas',document.querySelectorAll('.lead-tab')[0])">Ver conversa</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:32px;">Nenhum contato encontrado</td></tr>`;
  document.getElementById('count-contatos').textContent = leads.length;
}

function filterContatos(q) { state.contFilter = q; renderContatos(); }
function filterTemperatura(v) { state.contTempFilter = v; renderContatos(); }

// ── PIPELINE ─────────────────────────────────────────────────
function renderPipeline() {
  let total = 0;
  state.pipeline.forEach(s => s.deals.forEach(d => { total += d.valor || 0; }));
  document.getElementById('pipeline-total-value').textContent = total > 0 ? `R$ ${total.toLocaleString('pt-BR')}` : 'R$ 0';
  document.getElementById('count-pipeline').textContent = total > 0 ? `R$ ${(total/1000).toFixed(0)}k` : '0';
  document.getElementById('pipeline-board').innerHTML = state.pipeline.map(s => `
    <div class="pipeline-col" id="col-${s.id}" ondragover="onDragOver(event,'${s.id}')" ondragleave="onDragLeave(event,'${s.id}')" ondrop="onDrop(event,'${s.id}')">
      <div class="pipeline-col-header">
        <div class="pipeline-col-title"><div class="pipeline-col-dot" style="background:${s.cor}"></div>${s.nome}</div>
        <span class="pipeline-col-count">${s.deals.length}</span>
      </div>
      ${s.desc ? `<div class="pipeline-col-desc">${s.desc}</div>` : ''}
      ${s.deals.map(d => `
        <div class="pipeline-card" draggable="true" id="deal-${d.id}" ondragstart="onDragStart(event,'${d.id}')">
          <div class="pipeline-card-name">${d.titulo}</div>
          <div class="pipeline-card-company">${d.lead}</div>
          <div class="pipeline-card-footer">
            <span class="pipeline-card-value">${d.valor > 0 ? 'R$ '+d.valor.toLocaleString('pt-BR') : '—'}</span>
            <span class="badge badge-teal" style="font-size:10px;">${d.label||''}</span>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

function onDragStart(e, id) { state.dragDealId = id; setTimeout(()=>e.target.classList.add('dragging'),0); }
function onDragOver(e, id)  { e.preventDefault(); document.getElementById('col-'+id)?.classList.add('drag-over'); }
function onDragLeave(e, id) { document.getElementById('col-'+id)?.classList.remove('drag-over'); }
async function onDrop(e, id) {
  e.preventDefault();
  document.getElementById('col-'+id)?.classList.remove('drag-over');
  if (!state.dragDealId) return;
  await DATA_LAYER.moveDeal(state.dragDealId, id);
  state.pipeline = await DATA_LAYER.getPipeline();
  renderPipeline();
  state.dragDealId = null;
  toast('Deal movido', 'success');
}

// ── MODAIS ───────────────────────────────────────────────────
function openNewLeadModal() { document.getElementById('new-lead-nome').value=''; document.getElementById('new-lead-mensagem').value=''; document.getElementById('modal-new-lead').classList.remove('hidden'); }

async function saveLead() {
  const nome = document.getElementById('new-lead-nome').value.trim();
  const canal = document.getElementById('new-lead-canal').value;
  const msg   = document.getElementById('new-lead-mensagem').value.trim();
  if (!nome) { toast('Informe o nome do contato', 'warn'); return; }
  const btn = document.querySelector('#modal-new-lead .btn-primary');
  btn.textContent = 'Classificando…'; btn.disabled = true;
  const r = await window.callClaude({
    systemPrompt:`Você classifica leads de ${CLIENT_CONFIG.empresa}. Público-alvo: ${CLIENT_CONFIG.publico_alvo}. Retorne APENAS JSON: {"temperatura":"quente|morno|frio","intencao":"...","prioridade":1-5,"proximo_passo":"..."}`,
    userPayload:{ canal, mensagem_original:msg, data_contato:new Date().toISOString().slice(0,10), historico_interacoes:0 },
    mockResponse:JSON.stringify({ temperatura:'morno', intencao:'Interesse em revestimento para projeto. Sem urgência de prazo definida ainda.', prioridade:3, proximo_passo:'Entender se é projeto próprio, cliente de arquitetura/construção ou revenda antes de indicar linha e preço.' })
  });
  try {
    const ai = JSON.parse(r);
    const lead = { id:'l'+Date.now(), nome, canal, mensagem_original:msg, temperatura:ai.temperatura, prioridade:ai.prioridade, status:'open', proximo_passo:ai.proximo_passo, ai_intencao:ai.intencao, ai_qualificacao:'', lead_score:ai.prioridade*18, sentimento:'neutral', criado_em:new Date().toISOString().slice(0,10), historico: msg ? [{dir:'inbound',text:msg,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}] : [] };
    await DATA_LAYER.addLead(lead);
    state.leads = await DATA_LAYER.getLeads();
    renderConversas(); renderContatos();
    closeModal('modal-new-lead');
    toast(`${nome} adicionado como lead ${ai.temperatura}`, 'success');
  } catch { toast('Erro ao classificar lead', 'error'); }
  btn.textContent = 'Classificar com IA →'; btn.disabled = false;
}

function openNewDealModal() {
  document.getElementById('new-deal-lead').innerHTML = state.leads.map(l=>`<option value="${l.id}">${l.nome}</option>`).join('');
  document.getElementById('new-deal-titulo').value = ''; document.getElementById('new-deal-valor').value = '';
  document.getElementById('modal-new-deal').classList.remove('hidden');
}

function openNewDealFromLead(id) {
  openNewDealModal();
  document.getElementById('new-deal-lead').value = id;
  const l = state.leads.find(x => x.id === id);
  if (l) document.getElementById('new-deal-titulo').value = `Proposta — ${l.nome}`;
}

async function saveDeal() {
  const titulo = document.getElementById('new-deal-titulo').value.trim();
  const leadId = document.getElementById('new-deal-lead').value;
  const stageId = document.getElementById('new-deal-stage').value;
  const valor  = parseFloat(document.getElementById('new-deal-valor').value) || 0;
  if (!titulo) { toast('Informe o título do deal', 'warn'); return; }
  const l = state.leads.find(x => x.id === leadId);
  const etapa = (window.BRUTO_OPS?.funil || []).find(e => e.id === stageId);
  // Se o deal está vinculado a um lead que já existe (real ou manual),
  // atualiza a etapa/valor DESSE lead — não cria um registro desconectado.
  await DATA_LAYER.addDeal({
    id: l ? l.id : 'd'+Date.now(), leadId: l ? l.id : null,
    titulo, lead: l?.nome || '—', valor, label: etapa?.nome || 'Contato', stage_id: stageId,
  });
  state.pipeline = await DATA_LAYER.getPipeline();
  renderPipeline(); closeModal('modal-new-deal');
  toast(`Deal "${titulo}" criado`, 'success');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function closeModalOnBackdrop(e, id) { if (e.target.classList.contains('modal-overlay')) closeModal(id); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal('modal-new-lead'); closeModal('modal-new-deal'); } });

init();
</script>
</body>
